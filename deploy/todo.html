    els.closeCheckin.addEventListener("click", closeCheckin);
    els.closeCompleted.addEventListener("click", closeCompleted);
    els.closeCounter.addEventListener("click", closeCounter);
    els.openCounterItem.addEventListener("click", () => openCounterItem());
    els.openCounterRecord.addEventListener("click", openCounterRecord);
    els.closeCounterItem.addEventListener("click", closeCounterItem);
    els.cancelCounterItem.addEventListener("click", closeCounterItem);
    els.closeCounterRecord.addEventListener("click", closeCounterRecord);
      els.cancelCounterRecord.addEventListener("click", closeCounterRecord);
      els.counterItemForm.addEventListener("submit", submitCounterItem);
      els.counterRecordTabs.addEventListener("click", handleCounterRecordTabClick);
      els.counterCalendarPrev.addEventListener("click", () => moveCounterCalendarMonth(-1));
      els.counterCalendarNext.addEventListener("click", () => moveCounterCalendarMonth(1));
      els.counterCalendarGrid.addEventListener("click", handleCounterCalendarClick);
    els.counterToastUndo.addEventListener("click", undoCounterRecord);
    els.counterShortcuts.addEventListener("click", handleCounterShortcutClick);
    els.workbenchCounters.addEventListener("click", handleCounterShortcutClick);
    els.counterHomePeriodToggle.addEventListener("click", toggleCounterHomePeriod);
    els.openCounterHome.addEventListener("click", openCounter);
    els.counterFilters.addEventListener("click", handleCounterFilterClick);
    els.counterRecords.addEventListener("click", handleCounterRecordListClick);
    els.counterPeriods.addEventListener("click", handleCounterPeriodClick);
    els.counterCharts.addEventListener("pointerover", handleCounterPieLegendOver);
    els.counterCharts.addEventListener("pointerout", handleCounterPieLegendOut);
    els.counterCharts.addEventListener("focusin", handleCounterPieLegendOver);
    els.counterCharts.addEventListener("focusout", handleCounterPieLegendOut);
    els.counterPrev.addEventListener("click", () => moveCounterPeriod(-1));
    els.counterNext.addEventListener("click", () => moveCounterPeriod(1));
    els.counterColors.addEventListener("click", handleCounterColorClick);
    els.counterItemPinned.addEventListener("click", toggleCounterPinned);
    els.newForm.addEventListener("submit", submitNewItem);
    document.addEventListener("keydown", handleKeys);
    window.addEventListener("pagehide", () => {
      if (!state.pendingMutations.length) return;
      const pending = state.pendingMutations.splice(0);
      for (const mutation of pending) {
        void mutation.run().catch(() => {});
      }
    });

    const authEls = {
      backdrop: document.getElementById("authBackdrop"),
      form: document.getElementById("authForm"),
      password: document.getElementById("authPassword"),
      submit: document.getElementById("authSubmit"),
      error: document.getElementById("authError"),
    };

    function sessionToken() {
      try {
        return localStorage.getItem(AUTH_TOKEN_KEY) || "";
      } catch {
        return "";
      }
    }

    function clearSessionToken() {
      try {
        localStorage.removeItem(AUTH_TOKEN_KEY);
      } catch {}
    }

    function showAuth(message) {
      authEls.backdrop.classList.add("open");
      authEls.error.textContent = message || "";
      window.setTimeout(() => authEls.password.focus(), 0);
    }

    function hideAuth() {
      authEls.backdrop.classList.remove("open");
      authEls.error.textContent = "";
      authEls.password.value = "";
    }

    function setAuthBusy(busy) {
      authEls.submit.disabled = busy;
      authEls.password.disabled = busy;
    }

    function handleSessionExpired() {
      clearSessionToken();
      showAuth("会话已失效，请重新输入密码");
    }

    authEls.form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = authEls.password.value;
      if (!password || authEls.submit.disabled) return;
      setAuthBusy(true);
      authEls.error.textContent = "";
      try {
        const response = await fetch(API_BASE + "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          if (response.status === 429) {
            const minutes = Math.ceil(Number(data.retryAfter || 0) / 60);
            authEls.error.textContent = minutes > 0 ? `尝试次数过多，请约 ${minutes} 分钟后再试` : "尝试次数过多，请稍后再试";
          } else if (response.status === 503) {
            authEls.error.textContent = "服务器配置异常，请稍后再试";
          } else {
            authEls.error.textContent = "密码错误，请重试";
          }
          return;
        }
        if (!data.token) throw new Error("missing_token");
        try {
          localStorage.setItem(AUTH_TOKEN_KEY, data.token);
        } catch {}
        hideAuth();
        void refresh({ initial: true });
      } catch {
        authEls.error.textContent = "无法连接服务器，请稍后再试";
      } finally {
        setAuthBusy(false);
      }
    });

    renderDateOptions();
    if (sessionToken()) {
      if (restoreStateCache()) {
        ensureSelected();
        renderCompletedBadge();
        render();
      } else {
        updateInteractionState();
      }
      void refresh({ initial: true });
    } else {
      updateInteractionState();
      showAuth();
    }

    async function refresh(options = {}) {
      const initial = options.initial === true;
      if (initial) {
        setReadOnly(true);
        setStatus(state.cacheLoaded
          ? `正在同步，当前显示${formatCacheAge(state.cacheSavedAt)}的缓存（只读）`
          : "正在连接数据库...");
      } else {
        setStatus("同步中...");
      }
      try {
        state.loading = true;
        const data = await apiGet(`/api/state?today=${state.today}&days=${DAY_COUNT}`);
        state.todos = Array.isArray(data.todos) ? data.todos : [];
        state.dailyTasks = Array.isArray(data.dailyTasks) ? data.dailyTasks : [];
        state.completedCount = Number(data.completedCount) || 0;
        state.counterItems = (Array.isArray(data.counterItems) ? data.counterItems : []).map((item) => ({ ...item, kind: "count", unit: "次", incrementValue: 1 }));
        resolveCounterSelectionMap();
        syncCounterSelection();
        resolveLocalSelection();
        setReadOnly(false);
        state.counterHomeLoadedPeriod = null;
        await loadCounterHomeData({ renderNow: false, reportErrors: false });
        state.cacheLoaded = false;
        state.cacheSavedAt = new Date().toISOString();
        saveStateCache();
        renderCompletedBadge();
        ensureSelected(options.preferId);
        render();
        setStatus("已同步");
      } catch (error) {
        if (error.unauthorized) return;
        if (initial) {
          setReadOnly(true);
          setStatus(
            state.cacheLoaded
              ? `同步失败，当前显示${formatCacheAge(state.cacheSavedAt)}的缓存（只读）：${error.message}`
              : `同步失败：${error.message}`,
            true,
            { retry: true, cache: state.cacheLoaded }
          );
        } else {
          setStatus("同步失败：" + error.message, true);
        }
      } finally {
        state.loading = false;
      }
    }

    function render() {
      renderCounterShortcuts();
      renderWorkbenchPrefixes();
      renderWorkbenchToday();
      renderWorkbenchUpcoming();
      renderWorkbenchShopping();
      renderWorkbenchDaily();
      renderWorkbenchCounters();
      focusEditingInput();
      updateInteractionState();
    }

    function prefixInfo(todo) {
      if (!todo || todo.sourceDailyTaskId || todo.dueDate === SHOPPING_GROUP) return null;
      const match = String(todo.text || "").match(/^([^:：]{1,48})[:：](?!\/\/)[\s]*(.+)$/);
      if (!match) return null;
      const label = match[1].trim();
      const taskText = match[2].trim();
      if (!label || !taskText) return null;
      return { key: label.toLocaleLowerCase(), label, taskText };
    }

    function prefixGroupsForWorkbench() {
      const groups = new Map();
      const todos = state.todos
        .filter((todo) => prefixInfo(todo))
        .sort(sortTodos);
      for (const todo of todos) {
        const info = prefixInfo(todo);
        if (!groups.has(info.key)) groups.set(info.key, { key: info.key, label: info.label, todos: [] });
        groups.get(info.key).todos.push(todo);
      }
      return Array.from(groups.values());
    }

    function ordinaryTodosForDate(date) {
      return state.todos
        .filter((todo) => todo.dueDate === date && !todo.sourceDailyTaskId && !prefixInfo(todo))
        .sort(sortTodos);
    }

    function shoppingTodosForWorkbench() {
      return state.todos
        .filter((todo) => todo.dueDate === SHOPPING_GROUP)
        .sort(sortTodos);
    }

    function renderWorkbenchPrefixes() {
      const groups = prefixGroupsForWorkbench();
      const total = groups.reduce((sum, group) => sum + group.todos.length, 0);
      els.prefixSummary.textContent = `${groups.length} 组 · ${total} 项`;
      els.prefixGroups.innerHTML = "";
      if (!groups.length) {
        appendWorkbenchEmpty(els.prefixGroups, "暂无项目");
        return;
      }
      for (const group of groups) {
        const section = document.createElement("section");
        section.className = "prefix-group";
        section.setAttribute("aria-label", `${group.label} 项目任务`);

        const label = document.createElement("div");
        label.className = "prefix-label";
        const name = document.createElement("strong");
        name.textContent = group.label;
        const count = document.createElement("span");
        count.textContent = `${group.todos.length} 项`;
        label.append(name, count);

        const list = document.createElement("div");
        list.className = "prefix-tasks";
        for (const todo of group.todos) {
          const info = prefixInfo(todo);
          list.appendChild(renderTodo(todo, {
            draggable: false,
            displayText: info?.taskText || todo.text,
          }));
        }
        section.append(label, list);
        els.prefixGroups.appendChild(section);
      }
    }

    function renderWorkbenchToday() {
      const todos = ordinaryTodosForDate(state.today);
      els.todaySummary.textContent = `${todos.length} 项`;
      els.todayTodos.innerHTML = "";
      configureWorkbenchDropList(els.todayTodos, state.today);
      if (!todos.length) {
        appendWorkbenchEmpty(els.todayTodos, "今天没有普通任务");
        return;
      }
      todos.forEach((todo, index) => {
        const row = renderTodo(todo);
        if (index === 0) row.classList.add("workbench-focus-todo");
        els.todayTodos.appendChild(row);
      });
    }

    function renderWorkbenchUpcoming() {
      els.upcomingGroups.innerHTML = "";
      let total = 0;
      let populatedDays = 0;
      for (let offset = 1; offset < DAY_COUNT; offset += 1) {
        const date = addDays(state.today, offset);
        const todos = ordinaryTodosForDate(date);
        if (!todos.length) continue;
        total += todos.length;
        populatedDays += 1;

        const section = document.createElement("section");
        section.className = "upcoming-day";
        const label = document.createElement("div");
        label.className = "upcoming-day-label";
        const name = document.createElement("strong");
        name.textContent = formatWorkbenchDayLabel(date, offset);
        const count = document.createElement("span");
        count.textContent = `${todos.length} 项 · ${formatMonthDay(date)}`;
        label.append(name, count);

        const list = document.createElement("div");
        list.className = "upcoming-task-list";
        configureWorkbenchDropList(list, date);
        for (const todo of todos) list.appendChild(renderTodo(todo, { meta: formatMonthDay(date) }));
        section.append(label, list);
        els.upcomingGroups.appendChild(section);
      }
      els.upcomingSummary.textContent = `${total} 项 · ${populatedDays} 天有安排`;
      const upcomingPanel = els.upcomingGroups.closest(".upcoming-panel");
      const upcomingRow = upcomingPanel?.parentElement;
      if (!total) {
        if (upcomingPanel) upcomingPanel.hidden = true;
        upcomingRow?.classList.add("upcoming-hidden");
        return;
      }
      if (upcomingPanel) upcomingPanel.hidden = false;
      upcomingRow?.classList.remove("upcoming-hidden");
    }

    function renderWorkbenchShopping() {
      const todos = shoppingTodosForWorkbench();
      els.shoppingSummary.textContent = `${todos.length} 项`;
      els.shoppingTodos.innerHTML = "";
      configureWorkbenchDropList(els.shoppingTodos, SHOPPING_GROUP);
      if (!todos.length) {
        appendWorkbenchEmpty(els.shoppingTodos, "购物清单为空");
        return;
      }
      for (const todo of todos) els.shoppingTodos.appendChild(renderTodo(todo));
    }

    function renderWorkbenchDaily() {
      const tasks = [...state.dailyTasks].sort((left, right) => Number(left.sortOrder) - Number(right.sortOrder));
      const completedToday = tasks.filter((task) => Array.isArray(task.checkins) && task.checkins.includes(state.today)).length;
      els.dailyHomeSummary.textContent = `${completedToday}/${tasks.length}`;
      els.workbenchDaily.innerHTML = "";
      const list = document.createElement("ul");
      list.className = "daily-items";
      list.id = "dailyItems";
      els.workbenchDaily.appendChild(list);
      els.dailyItems = list;
      if (!tasks.length) {
        const empty = document.createElement("li");
        empty.className = "daily-empty";
        empty.textContent = "暂无每日任务";
        list.appendChild(empty);
        return;
      }
      for (const task of tasks) {
        const checked = Array.isArray(task.checkins) && task.checkins.includes(state.today);
        const editing = state.dailyEditingId === task.id;
        const row = document.createElement("li");
        row.className = "daily-row";
        if (isSelectedDailyTask(task.id)) row.classList.add("selected");
        if (editing) row.classList.add("editing");
        row.dataset.dailyId = task.id;
        row.addEventListener("click", (event) => {
          if (!event.target.closest("button, input")) selectDailyTask(task.id);
        });
        row.addEventListener("dblclick", (event) => {
          if (event.target.closest("button, input")) return;
          startEditingDailyTask(task);
        });
        const check = document.createElement("button");
        check.className = "daily-home-check" + (checked ? " checked" : "");
        check.type = "button";
        check.disabled = state.readOnly || editing;
        check.setAttribute("aria-pressed", String(checked));
        check.setAttribute("aria-label", `${stripDailyTaskPrefix(task.text)} ${checked ? "今日已完成" : "今日未完成"}`);
        check.addEventListener("click", () => void toggleDailyCheckin(task, state.today, !checked));

        if (editing) {
          const input = document.createElement("input");
          input.className = "daily-edit-input";
          input.type = "text";
          input.maxLength = 240;
          input.autocomplete = "off";
          input.value = state.dailyEditingText;
          input.setAttribute("aria-label", `编辑每日任务：${stripDailyTaskPrefix(task.text)}`);
          input.addEventListener("input", () => {
            state.dailyEditingText = input.value;
          });
          let handled = false;
          const finish = (mode) => {
            if (handled) return;
            handled = true;
            if (mode === "save") {
              void saveEditingDailyTask(task);
            } else {
              cancelDailyTaskEdit();
            }
          };
          input.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
              event.preventDefault();
              finish("save");
            }
            if (event.key === "Escape") {
              event.preventDefault();
              finish("cancel");
            }
          });
          input.addEventListener("blur", () => finish("save"));
          row.append(check, input);
          list.appendChild(row);
          continue;
        }

        const main = document.createElement("div");
        main.className = "daily-main";
        const name = document.createElement("div");
        name.className = "daily-task-text";
        name.textContent = stripDailyTaskPrefix(task.text);
        main.appendChild(name);
        const actions = document.createElement("div");
        actions.className = "daily-actions";
        const count = createDailyActionButton({
          className: "daily-count-button",
          title: "补打卡",
          label: `补打卡：${stripDailyTaskPrefix(task.text)}，${formatDailyTaskStats(task).trim()}`,
          icon: formatDailyTaskStats(task),
          onClick: () => openCheckin(task),
        });
        count.dataset.taskId = task.id;
        const remove = createDailyActionButton({
          className: "daily-delete",
          title: "删除每日任务",
          label: `删除每日任务：${stripDailyTaskPrefix(task.text)}`,
          icon: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="m19 6-1 14H6L5 6"></path><path d="M10 11v5"></path><path d="M14 11v5"></path></svg>',
          onClick: () => deleteDailyTask(task),
        });
        actions.append(count, remove);
        row.append(check, main, actions);
        list.appendChild(row);
      }
      const pendingId = state.pendingDailyEditFocusId;
      if (pendingId) {
        state.pendingDailyEditFocusId = null;
        window.setTimeout(() => {
          const input = document.querySelector(`.daily-row[data-daily-id="${CSS.escape(pendingId)}"] .daily-edit-input`);
          if (input) {
            input.focus();
            input.select();
          }
        }, 0);
      }
    }

    function renderWorkbenchCounters() {
      const active = state.counterItems
        .filter((item) => Number(item.active ?? 1))
        .sort((left, right) => Number(left.sortOrder) - Number(right.sortOrder));
      const pinned = active.filter((item) => Number(item.pinned));
      const items = (pinned.length ? pinned : active).slice(0, 3);
      const periodLabel = state.counterHomePeriod === "month" ? "月" : "周";
      const nextPeriodLabel = state.counterHomePeriod === "month" ? "周" : "月";
      const totalsReady = state.counterHomeLoadedPeriod === state.counterHomePeriod;
      els.counterHomePeriodToggle.textContent = periodLabel;
      els.counterHomePeriodToggle.disabled = state.counterHomeLoading;
      els.counterHomePeriodToggle.setAttribute("aria-label", `当前显示本${periodLabel}累计，点击切换为本${nextPeriodLabel}`);
      els.counterHomePeriodToggle.title = `切换为本${nextPeriodLabel}累计`;
      els.workbenchCounters.innerHTML = "";
      if (!items.length) {
        appendWorkbenchEmpty(els.workbenchCounters, "暂无累计任务");
        return;
      }
      for (const item of items) {
        const row = document.createElement("div");
        row.className = "counter-home-item";
        if (isSelectedCounterItem(item.id)) row.classList.add("selected");
        row.dataset.counterItemId = item.id;
        row.addEventListener("click", (event) => {
          if (!event.target.closest("button")) selectCounterItem(item.id);
        });
        const iconFile = COUNTER_ACTIVITY_ICONS[String(item.name || "").trim()];
        const label = document.createElement("span");
        if (iconFile) {
          label.className = "counter-home-activity";
          label.tabIndex = 0;
          label.dataset.tooltip = item.name;
          label.setAttribute("role", "img");
          label.setAttribute("aria-label", item.name);
          const image = document.createElement("img");
          image.src = ACTIVITY_ICON_BASE + iconFile;
          image.alt = "";
          image.setAttribute("aria-hidden", "true");
          label.appendChild(image);
        } else {
          label.className = "counter-home-label";
          label.textContent = item.name;
        }
        const total = document.createElement("strong");
        total.textContent = state.counterHomeLoading
          ? "…"
          : totalsReady
            ? formatCounterValue(Number(state.counterHomeTotals[item.id]) || 0)
            : "—";
        const add = document.createElement("button");
        add.type = "button";
        add.disabled = state.readOnly;
        add.dataset.counterId = item.id;
        add.textContent = "+1";
        add.setAttribute("aria-label", `${item.name}增加一次`);
        row.append(label, total, add);
        els.workbenchCounters.appendChild(row);
      }
    }

    function toggleCounterHomePeriod() {
      if (state.counterHomeLoading) return;
      state.counterHomePeriod = state.counterHomePeriod === "week" ? "month" : "week";
      state.counterHomeLoadedPeriod = null;
      void loadCounterHomeData();
    }

    async function loadCounterHomeData(options = {}) {
      const period = state.counterHomePeriod;
      const range = counterDateRange(period, state.today);
      state.counterHomeLoading = true;
      if (options.renderNow !== false) renderWorkbenchCounters();
      try {
        const data = await apiGet(`/api/counters?today=${state.today}&from=${range.from}&to=${range.to}`);
        if (period !== state.counterHomePeriod) return;
        const totals = {};
        for (const item of state.counterItems) totals[item.id] = 0;
        for (const record of Array.isArray(data.records) ? data.records : []) {
          totals[record.itemId] = (Number(totals[record.itemId]) || 0) + Number(record.amount || 0);
        }
        state.counterHomeTotals = totals;
        state.counterHomeLoadedPeriod = period;
      } catch (error) {
        if (period === state.counterHomePeriod) state.counterHomeLoadedPeriod = null;
        if (options.reportErrors !== false) setStatus("累计加载失败：" + error.message, true);
      } finally {
        if (period === state.counterHomePeriod) {
          state.counterHomeLoading = false;
          if (options.renderNow !== false) renderWorkbenchCounters();
        }
      }
    }

    function adjustCounterHomeTotal(itemId, amount, recordedDate) {
      if (state.counterHomeLoadedPeriod !== state.counterHomePeriod) return;
      const range = counterDateRange(state.counterHomePeriod, state.today);
      if (recordedDate < range.from || recordedDate > range.to) return;
      state.counterHomeTotals[itemId] = Math.max(0, (Number(state.counterHomeTotals[itemId]) || 0) + Number(amount || 0));
    }

    function configureWorkbenchDropList(list, date) {
      list.dataset.date = date;
      list.ondragover = handleDragOver;
      list.ondrop = handleDrop;
    }

    function appendWorkbenchEmpty(container, message) {
      const empty = document.createElement("div");
      empty.className = "workbench-empty";
      empty.textContent = message;
      container.appendChild(empty);
    }

    function formatWorkbenchDayLabel(date, offset) {
      if (offset === 1) return "明天";
      if (offset === 2) return "后天";
      const parsed = parseDate(date);
      return `周${WEEKDAYS[parsed.getDay()]}`;
    }

    function renderCompletedBadge() {
      const count = Number(state.completedCount) || 0;
      els.openCompleted.title = count > 0 ? `已完成 ${count} 项` : "已完成";
      els.openCompleted.setAttribute("aria-label", count > 0 ? `打开已完成任务，共 ${count} 项` : "打开已完成任务");
    }

    function renderCounterShortcuts() {
      const pinned = state.counterItems
        .filter((item) => Number(item.active ?? 1) && Number(item.pinned))
        .sort((left, right) => Number(left.sortOrder) - Number(right.sortOrder))
        .slice(0, 3);
      const shortcuts = pinned.map((item) => `
        <button class="counter-shortcut" type="button" data-counter-id="${escapeHtml(item.id)}" style="--counter-color:${escapeHtml(item.color || COUNTER_COLORS[0])}" title="记录 ${escapeHtml(item.name)}，今天累计 ${escapeHtml(formatCounterValue(Number(item.todayTotal) || 0))}">
          <i class="counter-dot"></i>
          <span class="counter-shortcut-label"><strong>${escapeHtml(item.name)}</strong><small>点击 +1次</small></span>
        </button>`).join("");
      els.counterShortcuts.innerHTML = shortcuts + `
        <button class="counter-manage-button" type="button" data-counter-manage title="累计记录" aria-label="打开累计记录">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V10"></path><path d="M12 19V5"></path><path d="M19 19v-7"></path><path d="M3.5 19.5h17"></path></svg>
        </button>`;
    }

    function handleCounterShortcutClick(event) {
      const manage = event.target.closest("[data-counter-manage]");
      if (manage) {
        openCounter();
        return;
      }
      const button = event.target.closest("[data-counter-id]");
      if (!button) return;
      if (!canWrite()) return;
      void recordCounterQuick(button.dataset.counterId);
    }

    async function recordCounterQuick(itemId, options = {}) {
      if (!canWrite()) return null;
      const item = state.counterItems.find((entry) => entry.id === itemId);
      if (!item) return null;
      const amount = 1;
      const recordedDate = options.recordedDate || state.today;
      const recordedAt = new Date().toISOString();
      const record = {
        id: localId(),
        itemId,
        amount,
        recordedDate,
        recordedAt,
        __local: true,
      };

      if (recordedDate === state.today) item.todayTotal = (Number(item.todayTotal) || 0) + 1;
      adjustCounterHomeTotal(itemId, amount, recordedDate);
      state.counterRecords.unshift(record);
      renderCounterShortcuts();
      renderWorkbenchCounters();
      if (isCounterOpen()) renderCounterView();
      if (isCounterRecordOpen()) renderCounterCalendar();
      showCounterToast(item, record);

      enqueueMutation(async () => {
        const realItemId = state.localCounterRealByTempId.get(itemId) || itemId;
        const saved = await apiPost("/api/counter-records", {
          itemId: realItemId,
          recordedDate,
          recordedAt,
        });
        if (saved?.id) state.localRecordRealByTempId.set(record.id, saved.id);
      }, { key: `counter-record-create:${record.id}` });
      return record;
    }

    function showCounterToast(item, record) {
      window.clearTimeout(state.counterToastTimer);
      state.counterToastRecordId = record.id;
      els.counterToastMessage.innerHTML = `已记录：<b>${escapeHtml(item.name)} +1次</b>`;
      els.counterToast.classList.add("open");
      state.counterToastTimer = window.setTimeout(hideCounterToast, 5000);
    }

    function hideCounterToast() {
      els.counterToast.classList.remove("open");
      state.counterToastRecordId = null;
    }

    async function undoCounterRecord() {
      if (!canWrite()) return;
      const id = state.counterToastRecordId;
      if (!id) return;
      const record = state.counterRecords.find((entry) => entry.id === id);
      hideCounterToast();
      if (!record) return;

      if (record.__local) {
        const realId = state.localRecordRealByTempId.get(record.id);
        if (realId) {
          enqueueMutation(() => apiPost("/api/counter-records/delete", { id: realId }), { key: `counter-record-delete:${record.id}` });
        } else {
          cancelQueuedMutation(`counter-record-create:${record.id}`);
        }
      } else {
        enqueueMutation(() => apiPost("/api/counter-records/delete", { id: record.id }), { key: `counter-record-delete:${record.id}` });
      }

      state.counterRecords = state.counterRecords.filter((entry) => entry.id !== record.id);
      if (record.recordedDate === state.today) {
        const item = state.counterItems.find((entry) => entry.id === record.itemId);
        if (item) item.todayTotal = Math.max(0, (Number(item.todayTotal) || 0) - Number(record.amount || 0));
      }
      adjustCounterHomeTotal(record.itemId, -Number(record.amount || 0), record.recordedDate);
      renderCounterShortcuts();
      renderWorkbenchCounters();
      if (isCounterOpen()) renderCounterView();
      if (isCounterRecordOpen()) renderCounterCalendar();
      setStatus("已撤销记录");
    }

    function openCounter() {
      if (isNewModalOpen()) closeModal({ returnFocus: false });
      if (isCompletedOpen()) closeCompleted({ returnFocus: false });
      if (isCheckinOpen()) closeCheckin({ returnFocus: false });
      els.counterBackdrop.classList.add("open");
      void loadCounterData();
      window.setTimeout(() => els.openCounterItem.focus(), 0);
    }

    function closeCounter(options = {}) {
      els.counterBackdrop.classList.remove("open");
      closeCounterItem({ returnFocus: false });
      closeCounterRecord({ returnFocus: false });
      if (options.returnFocus !== false) {
        if (els.openCounterHome) els.openCounterHome.focus();
      }
    }

    async function loadCounterData() {
      if (state.readOnly) {
        state.counterRecords = [];
        syncCounterSelection();
        renderCounterView();
        return;
      }
      const range = counterDateRange();
      els.counterSummary.innerHTML = '<div class="counter-empty">统计加载中...</div>';
      try {
        const data = await apiGet(`/api/counters?today=${state.today}&from=${range.from}&to=${range.to}`);
        const previousTotals = new Map(state.counterItems.map((item) => [item.id, Number(item.todayTotal) || 0]));
        state.counterRecords = Array.isArray(data.records) ? data.records : [];
        state.counterItems = (Array.isArray(data.items) ? data.items : []).map((item) => ({ ...item, kind: "count", unit: "次", incrementValue: 1, todayTotal: previousTotals.get(item.id) || 0 }));
        if (range.from <= state.today && range.to >= state.today) {
          for (const item of state.counterItems) {
            item.todayTotal = state.counterRecords.filter((record) => record.itemId === item.id && record.recordedDate === state.today).reduce((sum, record) => sum + Number(record.amount || 0), 0);
          }
        }
        syncCounterSelection();
        renderCounterShortcuts();
        renderCounterView();
      } catch (error) {
        els.counterSummary.innerHTML = `<div class="counter-empty">加载失败：${escapeHtml(error.message)}</div>`;
        setStatus("累计加载失败：" + error.message, true);
      }
    }

    function renderCounterView() {
      const range = counterDateRange();
      els.counterRangeLabel.textContent = range.label;
      els.counterPeriods.querySelectorAll("[data-period]").forEach((button) => button.classList.toggle("active", button.dataset.period === state.counterPeriod));
      renderCounterFilters();
      renderCounterSummary();
      renderCounterCharts();
      renderCounterRecords();
    }

    function renderCounterFilters() {
      if (!state.counterItems.length) {
        els.counterFilters.innerHTML = '<div class="counter-sidebar-title">显示记录项</div><div class="counter-empty">还没有记录项</div>';
        return;
      }
      const selectedCount = state.counterSelectedIds.length;
      els.counterFilters.innerHTML = `<div class="counter-sidebar-title">显示记录项</div><div class="counter-filter-actions"><span>已选择 ${selectedCount} / ${state.counterItems.length}</span><button type="button" data-counter-select-all>${selectedCount === state.counterItems.length ? "清空" : "全选"}</button></div>` + state.counterItems.map((item) => {
        const checked = state.counterSelectedIds.includes(item.id);
        const writeDisabled = state.readOnly ? " disabled" : "";
        return `<div class="counter-filter-row"><button class="counter-check ${checked ? "checked" : ""}" type="button" data-counter-toggle="${escapeHtml(item.id)}">${checked ? "✓" : ""}</button><i class="counter-filter-dot" style="--counter-color:${escapeHtml(item.color)}"></i><span class="counter-filter-name">${escapeHtml(item.name)}</span><button class="counter-quick-add" type="button" data-counter-add="${escapeHtml(item.id)}" style="--counter-color:${escapeHtml(item.color)}" title="今天记录 1 次" aria-label="记录一次：${escapeHtml(item.name)}"${writeDisabled}>+1</button><div class="counter-item-actions"><button type="button" data-counter-edit="${escapeHtml(item.id)}"${writeDisabled}>编辑</button><button type="button" data-counter-archive="${escapeHtml(item.id)}"${writeDisabled}>删除</button></div></div>`;
      }).join("");
    }

    function handleCounterFilterClick(event) {
      const all = event.target.closest("[data-counter-select-all]");
      if (all) {
        const selectAll = state.counterSelectedIds.length !== state.counterItems.length;
        state.counterSelectedIds = selectAll ? state.counterItems.map((item) => item.id) : [];
        for (const item of state.counterItems) state.counterSelectionMap[item.id] = selectAll;
        saveCounterSelection();
        renderCounterView();
        return;
      }
      const add = event.target.closest("[data-counter-add]");
      if (add) {
        if (!canWrite()) return;
        add.disabled = true;
        void recordCounterQuick(add.dataset.counterAdd);
        return;
      }
      const toggle = event.target.closest("[data-counter-toggle]");
      if (toggle) {
        const id = toggle.dataset.counterToggle;
        const checked = state.counterSelectedIds.includes(id);
        state.counterSelectionMap[id] = !checked;
        state.counterSelectedIds = state.counterSelectedIds.includes(id) ? state.counterSelectedIds.filter((entry) => entry !== id) : state.counterSelectedIds.concat(id);
        saveCounterSelection();
        renderCounterView();
        return;
      }
      const edit = event.target.closest("[data-counter-edit]");
      if (edit) {
        if (!canWrite()) return;
        openCounterItem(edit.dataset.counterEdit);
        return;
      }
      const archive = event.target.closest("[data-counter-archive]");
      if (archive && canWrite()) void archiveCounterItem(archive.dataset.counterArchive);
    }

    function handleCounterPeriodClick(event) {
      const button = event.target.closest("[data-period]");
      if (!button || button.dataset.period === state.counterPeriod) return;
      state.counterPeriod = button.dataset.period;
      state.counterCursor = state.today;
      void loadCounterData();
    }

    function moveCounterPeriod(direction) {
      const cursor = parseDate(state.counterCursor);
      if (state.counterPeriod === "day") cursor.setDate(cursor.getDate() + direction);
      if (state.counterPeriod === "week") cursor.setDate(cursor.getDate() + direction * 7);
      if (state.counterPeriod === "month") cursor.setMonth(cursor.getMonth() + direction);
      if (state.counterPeriod === "year") cursor.setFullYear(cursor.getFullYear() + direction);
      state.counterCursor = toLocalDateString(cursor);
      void loadCounterData();
    }

    function counterDateRange(period = state.counterPeriod, cursorValue = state.counterCursor) {
      const cursor = parseDate(cursorValue);
      if (period === "day") {
        const value = toLocalDateString(cursor);
        return { from: value, to: value, label: `${cursor.getMonth() + 1}月${cursor.getDate()}日` };
      }
      if (period === "week") {
        const offset = (cursor.getDay() + 6) % 7;
        const from = addDays(toLocalDateString(cursor), -offset);
        const to = addDays(from, 6);
        return { from, to, label: `${formatMonthDay(from)} — ${formatMonthDay(to)}` };
      }
      if (period === "month") {
        const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
        const last = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0);
        return { from: toLocalDateString(first), to: toLocalDateString(last), label: `${first.getFullYear()}年${first.getMonth() + 1}月` };
      }
      const first = new Date(cursor.getFullYear(), 0, 1);
      const last = new Date(cursor.getFullYear(), 11, 31);
      return { from: toLocalDateString(first), to: toLocalDateString(last), label: `${first.getFullYear()}年` };
    }

    function renderCounterSummary() {
      const items = selectedCounterItems();
      if (!items.length) {
        els.counterSummary.innerHTML = '<div class="counter-empty">请至少勾选一个记录项</div>';
        return;
      }
      els.counterSummary.innerHTML = items.slice(0, 3).map((item) => {
        const records = selectedCounterRecords().filter((record) => record.itemId === item.id);
        const total = records.reduce((sum, record) => sum + Number(record.amount || 0), 0);
        return `<div class="counter-summary"><div class="counter-summary-name"><i class="counter-record-dot" style="--counter-color:${escapeHtml(item.color)}"></i>${escapeHtml(item.name)}</div><div class="counter-summary-value">${escapeHtml(formatCounterValue(total))}</div><div class="counter-summary-sub">${records.length} 条记录</div></div>`;
      }).join("");
    }

    function renderCounterCharts() {
      const items = selectedCounterItems();
      const records = selectedCounterRecords();
      if (!items.length) {
        els.counterCharts.innerHTML = "";
        return;
      }
      const series = items.map((item) => ({
        name: item.name,
        color: item.color,
        total: records.filter((record) => record.itemId === item.id).reduce((sum, record) => sum + Number(record.amount || 0), 0),
      }));
      els.counterCharts.innerHTML = renderCounterPieChart(series);
    }

    function renderCounterPieChart(series) {
      const entries = series;
      const total = entries.reduce((sum, entry) => sum + entry.total, 0);
      if (total <= 0) {
        return '<section class="counter-panel" data-counter-stats-chart><div class="counter-panel-head"><div><h3>统计</h3></div></div><div class="counter-empty">这个时间范围还没有记录</div></section>';
      }
      let progress = 0;
      const positiveEntries = entries.filter((entry) => entry.total > 0);
      const slices = positiveEntries.map((entry, index) => {
        const start = progress;
        const percentage = entry.total / total * 100;
        progress += percentage;
        const separator = positiveEntries.length > 1 ? Math.min(0.8, percentage * 0.18) : 0;
        const visible = Math.max(percentage - separator, 0.1);
        return `<circle class="counter-pie-segment" data-counter-pie-segment="${index}" cx="60" cy="60" r="44" pathLength="100" style="--counter-color:${escapeHtml(counterChartColor(entry.color))};stroke-dasharray:${visible} ${100 - visible};stroke-dashoffset:${-start}"><title>${escapeHtml(entry.name)}：${escapeHtml(formatCounterValue(entry.total))}，${escapeHtml(formatCounterPercentage(percentage))}</title></circle>`;
      }).join("");
      const details = entries.map((entry) => `${entry.name} ${formatCounterValue(entry.total)} ${formatCounterPercentage(entry.total / total * 100)}`).join("，");
      let positiveIndex = 0;
      const legend = entries.map((entry) => {
        const isZero = entry.total <= 0;
        const indexAttribute = isZero ? "" : ` data-counter-pie-index="${positiveIndex++}" tabindex="0"`;
        return `<div class="counter-pie-legend-row${isZero ? " is-zero" : ""}" role="listitem"${indexAttribute} style="--counter-color:${escapeHtml(counterChartColor(entry.color))}"><span class="counter-pie-legend-name"><i class="counter-record-dot" style="--counter-color:${escapeHtml(counterChartColor(entry.color))}"></i><b>${escapeHtml(entry.name)}</b></span><strong class="counter-pie-legend-value">${escapeHtml(formatCounterValue(entry.total))}</strong><span class="counter-pie-legend-percent">${escapeHtml(formatCounterPercentage(entry.total / total * 100))}</span></div>`;
      }).join("");
      return `<section class="counter-panel" data-counter-stats-chart><div class="counter-panel-head"><div><h3>统计</h3></div></div><div class="counter-pie-layout"><div class="counter-pie" data-counter-pie role="img" aria-label="统计：总计 ${escapeHtml(formatCounterValue(total))}，${escapeHtml(details)}"><svg class="counter-pie-svg" viewBox="0 0 120 120" aria-hidden="true"><circle class="counter-pie-track" cx="60" cy="60" r="44"></circle>${slices}</svg><div class="counter-pie-total"><strong>${escapeHtml(formatCounterValue(total))}</strong><span>总计</span></div></div><div class="counter-pie-legend" role="list">${legend}</div></div></section>`;
    }

    function handleCounterPieLegendOver(event) {
      const row = event.target.closest("[data-counter-pie-index]");
      if (!row || !els.counterCharts.contains(row)) return;
      setCounterPieHighlight(row.dataset.counterPieIndex);
    }

    function handleCounterPieLegendOut(event) {
      const row = event.target.closest("[data-counter-pie-index]");
      if (!row || row.contains(event.relatedTarget)) return;
      setCounterPieHighlight("");
    }

    function setCounterPieHighlight(index) {
      const pie = els.counterCharts.querySelector("[data-counter-pie]");
      if (!pie) return;
      const active = index !== "";
      pie.classList.toggle("has-highlight", active);
      pie.querySelectorAll("[data-counter-pie-segment]").forEach((segment) => segment.classList.toggle("is-active", active && segment.dataset.counterPieSegment === index));
      els.counterCharts.querySelectorAll("[data-counter-pie-index]").forEach((row) => row.classList.toggle("is-active", active && row.dataset.counterPieIndex === index));
    }

    function renderCounterRecords() {
      const records = selectedCounterRecords().slice(0, 80);
      const itemMap = new Map(state.counterItems.map((item) => [item.id, item]));
      if (!records.length) {
        els.counterRecords.innerHTML = '<div class="counter-empty">这个时间范围还没有记录</div>';
        return;
      }
      els.counterRecords.innerHTML = records.map((record) => {
        const item = itemMap.get(record.itemId);
        if (!item) return "";
        return `<div class="counter-record-row"><span class="counter-record-time">${escapeHtml(formatCounterRecordTime(record))}</span><span class="counter-record-name"><i class="counter-record-dot" style="--counter-color:${escapeHtml(item.color)}"></i>${escapeHtml(item.name)}</span><span class="counter-record-value">+${escapeHtml(formatCounterValue(Number(record.amount), item.unit))}</span><button class="counter-record-delete" type="button" data-counter-record-delete="${escapeHtml(record.id)}" title="删除记录">×</button></div>`;
      }).join("");
    }

    async function handleCounterRecordListClick(event) {
      const button = event.target.closest("[data-counter-record-delete]");
      if (!button || !canWrite() || !window.confirm("删除这条累计记录？")) return;
      const id = button.dataset.counterRecordDelete;
      const record = state.counterRecords.find((entry) => entry.id === id);
      if (record?.__local) {
        const realId = state.localRecordRealByTempId.get(id);
        if (realId) {
          enqueueMutation(() => apiPost("/api/counter-records/delete", { id: realId }), { key: `counter-record-delete:${id}` });
        } else {
          cancelQueuedMutation(`counter-record-create:${id}`);
        }
      } else {
        enqueueMutation(() => apiPost("/api/counter-records/delete", { id }), { key: `counter-record-delete:${id}` });
      }
      state.counterRecords = state.counterRecords.filter((entry) => entry.id !== id);
      if (record?.recordedDate === state.today) {
        const item = state.counterItems.find((entry) => entry.id === record.itemId);
        if (item) item.todayTotal = Math.max(0, (Number(item.todayTotal) || 0) - Number(record.amount || 0));
        adjustCounterHomeTotal(record.itemId, -Number(record.amount || 0), record.recordedDate);
      }
      renderCounterShortcuts();
      renderWorkbenchCounters();
      if (isCounterOpen()) renderCounterView();
    }

    function selectedCounterItems() {
      return state.counterItems.filter((item) => state.counterSelectedIds.includes(item.id));
    }

    function selectedCounterRecords() {
      return state.counterRecords.filter((record) => state.counterSelectedIds.includes(record.itemId));
    }

    function openCounterItem(itemId = "") {
      if (!canWrite()) return;
      const item = state.counterItems.find((entry) => entry.id === itemId);
      els.counterItemId.value = item?.id || "";
      els.counterItemTitle.textContent = item ? "编辑记录项" : "新建记录项";
      els.counterItemName.value = item?.name || "";
      state.counterItemPinned = item ? Boolean(Number(item.pinned)) : true;
      els.counterItemColor.value = item?.color || COUNTER_COLORS[0];
      renderCounterItemFormState();
      els.counterItemBackdrop.classList.add("open");
      window.setTimeout(() => els.counterItemName.focus(), 0);
    }

    function closeCounterItem(options = {}) {
      els.counterItemBackdrop.classList.remove("open");
      if (options.returnFocus !== false && isCounterOpen()) els.openCounterItem.focus();
    }

    function handleCounterColorClick(event) {
      if (!canWrite()) return;
      const button = event.target.closest("[data-color]");
      if (!button) return;
      els.counterItemColor.value = button.dataset.color;
      renderCounterItemFormState();
    }

    function toggleCounterPinned() {
      if (!canWrite()) return;
      state.counterItemPinned = !state.counterItemPinned;
      renderCounterItemFormState();
    }

    function renderCounterItemFormState() {
      els.counterColors.querySelectorAll("[data-color]").forEach((button) => button.classList.toggle("active", button.dataset.color === els.counterItemColor.value));
      els.counterItemPinned.classList.toggle("active", state.counterItemPinned);
      els.counterItemPinned.setAttribute("aria-pressed", String(state.counterItemPinned));
    }

    async function submitCounterItem(event) {
      event.preventDefault();
      if (!canWrite()) return;
      const name = els.counterItemName.value.trim();
      if (!name) {
        els.counterItemName.focus();
        return;
      }
      const id = els.counterItemId.value;
      const payload = { id, name, color: els.counterItemColor.value, pinned: state.counterItemPinned };

      if (id) {
        const item = state.counterItems.find((entry) => entry.id === id);
        if (item) {
          item.name = name;
          item.color = els.counterItemColor.value;
          item.pinned = state.counterItemPinned ? 1 : 0;
        }
        closeCounterItem({ returnFocus: false });
        renderCounterShortcuts();
        renderWorkbenchCounters();
        if (isCounterOpen()) renderCounterView();
        enqueueMutation(() => apiPost("/api/counter-items/update", payload), { key: `counter-update:${id}` });
        setStatus("记录项已更新");
        return;
      }

      const item = createLocalCounterItem(name);
      item.color = els.counterItemColor.value;
      item.pinned = state.counterItemPinned ? 1 : 0;
      state.counterSelectionMap[item.id] = true;
      syncCounterSelection();
      saveCounterSelection();
      closeCounterItem({ returnFocus: false });
      renderCounterShortcuts();
      renderWorkbenchCounters();
      if (isCounterOpen()) renderCounterView();
      enqueueMutation(async () => {
        const saved = await apiPost("/api/counter-items", {
          name,
          pinned: state.counterItemPinned,
          color: els.counterItemColor.value,
        });
        if (saved?.id) state.localCounterRealByTempId.set(item.id, saved.id);
      }, { key: `counter-create:${item.id}` });
      setStatus("记录项已创建");
    }

    async function archiveCounterItem(id) {
      if (!canWrite()) return;
      const item = state.counterItems.find((entry) => entry.id === id);
      if (!item || !window.confirm(`删除“${item.name}”？删除后不再显示这个记录项，但历史记录仍然保留。`)) return;
      if (isLocalId(id)) {
        cancelQueuedMutation(`counter-create:${id}`);
      } else {
        enqueueMutation(() => apiPost("/api/counter-items/archive", { id }), { key: `counter-archive:${id}` });
      }
      state.counterItems = state.counterItems.filter((entry) => entry.id !== id);
      delete state.counterSelectionMap[id];
      syncCounterSelection();
      saveCounterSelection();
      renderCounterShortcuts();
      renderWorkbenchCounters();
      if (isCounterOpen()) renderCounterView();
      setStatus("记录项已删除，历史记录仍保留");
    }

    function openCounterRecord() {
      if (!canWrite()) return;
      if (!state.counterItems.length) {
        openCounterItem();
        return;
      }
      if (!state.counterItems.some((item) => item.id === state.counterCalendarItemId)) state.counterCalendarItemId = state.counterItems[0].id;
      state.counterCalendarMonth = state.today.slice(0, 7) + "-01";
      els.counterRecordBackdrop.classList.add("open");
      renderCounterRecordTabs();
      void loadCounterCalendar();
      window.setTimeout(() => els.counterRecordTabs.querySelector(".active")?.focus(), 0);
    }

    function closeCounterRecord(options = {}) {
      els.counterRecordBackdrop.classList.remove("open");
      if (options.returnFocus !== false && isCounterOpen()) els.openCounterRecord.focus();
    }

    function renderCounterRecordTabs() {
      els.counterRecordTabs.innerHTML = state.counterItems.map((item) => {
        const active = item.id === state.counterCalendarItemId;
        return `<button class="counter-record-tab ${active ? "active" : ""}" type="button" role="tab" aria-selected="${active}" data-counter-record-item="${escapeHtml(item.id)}" style="--counter-color:${escapeHtml(item.color)}">${escapeHtml(item.name)} · +1次</button>`;
      }).join("");
    }

    function handleCounterRecordTabClick(event) {
      const tab = event.target.closest("[data-counter-record-item]");
      if (!tab || tab.dataset.counterRecordItem === state.counterCalendarItemId) return;
      state.counterCalendarItemId = tab.dataset.counterRecordItem;
      renderCounterRecordTabs();
      void loadCounterCalendar();
    }

    async function loadCounterCalendar() {
      if (state.readOnly) return;
      const item = state.counterItems.find((entry) => entry.id === state.counterCalendarItemId) || state.counterItems[0];
      if (!item) return;
      state.counterCalendarItemId = item.id;
      renderCounterRecordTabs();
      const range = counterCalendarRange();
      state.counterCalendarLoading = true;
      renderCounterCalendar();
      try {
        const data = await apiGet(`/api/counters?today=${state.today}&from=${range.from}&to=${range.to}`);
        state.counterCalendarRecords = (Array.isArray(data.records) ? data.records : []).filter((record) => record.itemId === item.id);
      } catch (error) {
        setStatus("补记日历加载失败：" + error.message, true);
        state.counterCalendarRecords = [];
      } finally {
        state.counterCalendarLoading = false;
        renderCounterCalendar();
      }
    }

    function renderCounterCalendar() {
      const item = state.counterItems.find((entry) => entry.id === state.counterCalendarItemId);
      if (!item) return;
      const range = counterCalendarRange();
      const month = parseDate(range.from);
      els.counterRecordTitle.textContent = `补记 · ${item.name}`;
      els.counterCalendarSummary.textContent = `${item.name}每点击一次增加 1次，可以连续点击同一天。`;
      els.counterCalendarMonthLabel.textContent = `${month.getFullYear()}年${month.getMonth() + 1}月`;
      els.counterCalendarNext.disabled = range.from >= state.today.slice(0, 7) + "-01";
      if (state.counterCalendarLoading) {
        els.counterCalendarGrid.innerHTML = '<div class="counter-empty" style="grid-column:1/-1">日历加载中...</div>';
        return;
      }
      const totals = new Map();
      for (const record of state.counterCalendarRecords) {
        totals.set(record.recordedDate, (totals.get(record.recordedDate) || 0) + Number(record.amount || 0));
      }
      const firstWeekday = (month.getDay() + 6) % 7;
      const days = parseDate(range.to).getDate();
      const cells = Array.from({ length: firstWeekday }, () => '<div class="counter-calendar-blank" aria-hidden="true"></div>');
      for (let day = 1; day <= days; day += 1) {
        const date = `${range.from.slice(0, 8)}${String(day).padStart(2, "0")}`;
        const total = totals.get(date) || 0;
        const disabled = date > state.today;
        const totalText = disabled ? "" : (total > 0 ? `已记 ${formatCounterValue(total)}` : "+1次");
        const title = disabled ? `${date}，未来日期不能补记` : `${date}，点击增加 1次`;
        cells.push(`<button class="counter-calendar-day ${date === state.today ? "today" : ""} ${total > 0 ? "has-records" : ""}" type="button" data-counter-calendar-date="${date}" ${disabled ? "disabled" : ""} title="${escapeHtml(title)}"><span class="counter-calendar-date">${month.getMonth() + 1}/${day}</span><span class="counter-calendar-total">${escapeHtml(totalText)}</span></button>`);
      }
      els.counterCalendarGrid.innerHTML = cells.join("");
    }

    function counterCalendarRange() {
      const first = parseDate(state.counterCalendarMonth);
      const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
      return { from: toLocalDateString(first), to: toLocalDateString(last) };
    }

    function moveCounterCalendarMonth(direction) {
      const current = parseDate(state.counterCalendarMonth);
      current.setMonth(current.getMonth() + direction);
      const next = toLocalDateString(new Date(current.getFullYear(), current.getMonth(), 1));
      const currentMonth = state.today.slice(0, 7) + "-01";
      if (next > currentMonth) return;
      state.counterCalendarMonth = next;
      void loadCounterCalendar();
    }

    async function handleCounterCalendarClick(event) {
      const button = event.target.closest("[data-counter-calendar-date]");
      if (!button || !canWrite() || button.disabled || state.counterCalendarLoading) return;
      const item = state.counterItems.find((entry) => entry.id === state.counterCalendarItemId);
      if (!item) return;
      button.disabled = true;
      const record = await recordCounterQuick(item.id, {
        recordedDate: button.dataset.counterCalendarDate,
      });
      if (!record) {
        button.disabled = false;
        return;
      }
      state.counterCalendarRecords.unshift(record);
      renderCounterCalendar();
    }

    function formatCounterAmount(value) {
      const rounded = Math.round((Number(value) || 0) * 100) / 100;
      return Number.isInteger(rounded) ? String(rounded) : String(rounded).replace(/0+$/, "").replace(/\.$/, "");
    }

    function formatCounterPercentage(value) {
      const rounded = Math.round((Number(value) || 0) * 10) / 10;
      return `${Number.isInteger(rounded) ? rounded : rounded.toFixed(1)}%`;
    }

    function counterChartColor(value) {
      const color = String(value || "");
      return /^#[0-9a-f]{6}$/i.test(color) ? color : "#256d85";
    }

    function formatCounterValue(value) {
      return `${formatCounterAmount(value)}次`;
    }

    function formatCounterRecordTime(record) {
      const date = new Date(record.recordedAt);
      const time = Number.isNaN(date.getTime()) ? "" : ` ${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
      if (record.recordedDate === state.today) return `今天${time}`;
      return `${formatMonthDay(record.recordedDate)}${time}`;
    }

    function formatMonthDay(value) {
      const date = parseDate(value);
      return `${date.getMonth() + 1}月${date.getDate()}日`;
    }

    function isCounterOpen() {
      return els.counterBackdrop.classList.contains("open");
    }

    function isCounterItemOpen() {
      return els.counterItemBackdrop.classList.contains("open");
    }

    function isCounterRecordOpen() {
      return els.counterRecordBackdrop.classList.contains("open");
    }

    function renderGroup({ key, label, todos, offset }) {
      const day = document.createElement("article");
      day.className = "day";
      day.dataset.date = key;

      if (offset === 0) day.classList.add("today-group");
      if (isCollapsed(key, offset)) day.classList.add("collapsed");

      const header = document.createElement("button");
      header.className = "day-header";
      if (isSelectedGroup(key)) header.classList.add("selected");
      header.type = "button";
      header.innerHTML = `
        <span class="day-title">
          <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 4l8 6-8 6"></path>
          </svg>
          <span>${escapeHtml(label)}</span>
        </span>
        <span class="day-count">${todos.length} 项</span>
      `;
      header.addEventListener("click", () => {
        selectGroup(key, { renderNow: false });
        toggleGroup(key);
      });
      day.appendChild(header);

      const list = document.createElement("div");
      list.className = "todo-list";
      list.dataset.date = key;
      list.addEventListener("dragover", handleDragOver);
      list.addEventListener("drop", handleDrop);

      if (todos.length) {
        for (const todo of todos) list.appendChild(renderTodo(todo));
      } else {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "没有待办事项";
        list.appendChild(empty);
      }

      day.appendChild(list);
      els.groups.appendChild(day);
    }

    function renderTodo(todo, options = {}) {
      const row = document.createElement("div");
      const isEditing = todo.id === state.editingId;
      row.className = "todo";
      if (options.className) row.classList.add(options.className);
      if (isSelectedTodo(todo.id)) row.classList.add("selected");
      if (todo.id === state.draggingId) row.classList.add("dragging");
      if (isEditing) row.classList.add("editing");
      row.dataset.id = todo.id;
      row.draggable = options.draggable !== false && !state.readOnly && !isEditing;
      row.tabIndex = -1;
      row.addEventListener("click", (event) => {
        if (!event.target.closest(".checkbox") && !event.target.closest(".todo-input") && !event.target.closest(".todo-action")) selectTodo(todo.id);
      });
      row.addEventListener("dblclick", (event) => {
        if (!canWrite()) return;
        if (event.target.closest(".checkbox") || event.target.closest(".todo-input") || event.target.closest(".todo-action")) return;
        startEditingTodo(todo);
      });
      row.addEventListener("dragstart", (event) => {
        if (!canWrite()) {
          event.preventDefault();
          return;
        }
        state.draggingId = todo.id;
        row.classList.add("dragging");
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", todo.id);
        clearDropIndicator();
      });
      row.addEventListener("dragend", () => {
        endDrag();
      });

      const checkbox = document.createElement("button");
      checkbox.className = "checkbox";
      checkbox.type = "button";
      checkbox.disabled = state.readOnly;
      checkbox.title = "完成（Space）";
      checkbox.setAttribute("aria-label", "完成：" + todo.text);
      checkbox.addEventListener("click", (event) => {
        event.stopPropagation();
        completeSelected(todo.id);
      });

      row.appendChild(checkbox);
      if (isEditing) {
        const input = document.createElement("input");
        input.className = "todo-input";
        input.type = "text";
        input.maxLength = 240;
        input.autocomplete = "off";
        input.value = state.editingText;
        input.setAttribute("aria-label", "编辑待办事项");
        input.addEventListener("click", (event) => event.stopPropagation());
        input.addEventListener("dblclick", (event) => event.stopPropagation());
        input.addEventListener("input", () => {
          state.editingText = input.value;
        });
        let handled = false;
        const finish = async (mode) => {
          if (handled) return;
          handled = true;
          if (mode === "save") {
            await saveEditingTodo(todo.id, todo.text);
            return;
          }
          cancelEditingTodo();
        };
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            void finish("save");
          }
          if (event.key === "Escape") {
            event.preventDefault();
            void finish("cancel");
          }
        });
        input.addEventListener("blur", () => {
          void finish("save");
        });
        row.appendChild(input);
        return row;
      }

      const text = document.createElement("div");
      text.className = "todo-text";
      const label = document.createElement("span");
      label.className = "workbench-task-label";
      label.textContent = options.displayText || todo.text;
      text.appendChild(label);
      if (options.meta) {
        const meta = document.createElement("small");
        meta.className = "workbench-task-meta";
        meta.textContent = options.meta;
        text.appendChild(meta);
      }
      row.appendChild(text);

      if (options.actions === false) return row;

      const actions = document.createElement("div");
      actions.className = "todo-actions";

      const pinTop = document.createElement("button");
      pinTop.className = "todo-action";
      pinTop.type = "button";
      pinTop.disabled = state.readOnly;
      pinTop.title = "置顶（1）";
      pinTop.setAttribute("aria-label", "置顶：" + todo.text);
      pinTop.innerHTML = `
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 18V6"></path>
          <path d="M7 11l5-5 5 5"></path>
          <path d="M5 4h14"></path>
        </svg>
      `;
      pinTop.addEventListener("click", (event) => {
        event.stopPropagation();
        void moveTodoToEdge(todo.id, "top");
      });

      const pinBottom = document.createElement("button");
      pinBottom.className = "todo-action";
      pinBottom.type = "button";
      pinBottom.disabled = state.readOnly;
      pinBottom.title = "置底（2）";
      pinBottom.setAttribute("aria-label", "置底：" + todo.text);
      pinBottom.innerHTML = `
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 6v12"></path>
          <path d="M7 13l5 5 5-5"></path>
          <path d="M5 20h14"></path>
        </svg>
      `;
      pinBottom.addEventListener("click", (event) => {
        event.stopPropagation();
        void moveTodoToEdge(todo.id, "bottom");
      });

      actions.appendChild(pinTop);
      actions.appendChild(pinBottom);
      row.appendChild(actions);
      return row;
    }

      const button = document.createElement("button");
      button.className = className;
      button.type = "button";
      button.disabled = state.readOnly;
      button.title = title;

    function formatDailyTaskStats(task) {
      const completed = Number(task.completedCount) || 0;
      const total = Number(task.totalCount) || 0;
      const percent = total > 0 ? (completed / total) * 100 : 0;
      return `${completed}/${total}   ${percent.toFixed(2)}%`;

    async function loadCompletedTodos() {
      if (state.readOnly) {
        state.completedTodos = [];
        renderCompletedList("缓存模式下仅显示已完成数量，完成同步后可查看明细");
        return;

    function renderCompletedList(message = "") {

        els.completedSummary.textContent = message;

    function handleKeys(event) {
      const newModalOpen = isNewModalOpen();
      const checkinOpen = isCheckinOpen();
      const completedOpen = isCompletedOpen();
      const counterOpen = isCounterOpen();
      const counterItemOpen = isCounterItemOpen();
      const counterRecordOpen = isCounterRecordOpen();
      const quickLinks = {
        "1": "https://todo.choi975.workers.dev/",
        "2": "https://badminton.choi975.workers.dev/",
        "3": "https://wenti.choi975.workers.dev/",
        "4": "https://sien-day.choi975.workers.dev/",
        "5": "https://choi975.github.io/xizang/",
      };
      if (event.ctrlKey && event.altKey && !event.metaKey && !event.shiftKey && /^[12345]$/.test(event.key) && !newModalOpen && !checkinOpen && !completedOpen && !counterOpen && !counterItemOpen && !counterRecordOpen) {
        event.preventDefault();
        window.open(quickLinks[event.key], "_blank", "noopener,noreferrer");
        return;
      }
      if (event.altKey && !event.ctrlKey && !event.metaKey && !event.shiftKey && /^[12345]$/.test(event.key) && !newModalOpen && !checkinOpen && !completedOpen && !counterOpen && !counterItemOpen && !counterRecordOpen) {
        event.preventDefault();
        window.location.href = quickLinks[event.key];
        return;
      }
      if (event.altKey && event.key.toLowerCase() === "n" && !checkinOpen && !completedOpen && !counterOpen && !counterItemOpen && !counterRecordOpen) {
        event.preventDefault();
        if (!canWrite()) return;
        openModal();
        return;
      }
      if (event.key === "Escape" && checkinOpen) {
        event.preventDefault();
        closeCheckin();
        return;
      }
      if (event.key === "Escape" && completedOpen) {
        event.preventDefault();
        closeCompleted();
        return;
      }
      if (event.key === "Escape" && newModalOpen) {
        event.preventDefault();
        closeModal();
        return;
      }
      if (event.key === "Escape" && counterRecordOpen) {
        event.preventDefault();
        closeCounterRecord();
        return;
      }
      if (event.key === "Escape" && counterItemOpen) {
        event.preventDefault();
        closeCounterItem();
        return;
      }
      if (event.key === "Escape" && counterOpen) {
        event.preventDefault();
        closeCounter();
        return;
      }
      if (newModalOpen || checkinOpen || completedOpen || counterOpen || counterItemOpen || counterRecordOpen) return;
      if (isTextEntryTarget(event.target) || state.editingId) return;
      const isTabShortcut = event.key === "Tab" && !event.shiftKey && !event.ctrlKey && !event.metaKey && !event.altKey;
      const isPinShortcut = !event.ctrlKey && !event.metaKey && !event.altKey && !event.shiftKey && (event.key === "1" || event.code === "Numpad1");
      const isBottomShortcut = !event.ctrlKey && !event.metaKey && !event.altKey && !event.shiftKey && (event.key === "2" || event.code === "Numpad2");
      const isCollapseShortcut = !event.ctrlKey && !event.metaKey && !event.altKey && !event.shiftKey && event.key.toLowerCase() === "z";
      const isAltMoveUp = event.altKey && !event.ctrlKey && !event.metaKey && event.key === "ArrowUp";
      const isAltMoveDown = event.altKey && !event.ctrlKey && !event.metaKey && event.key === "ArrowDown";
      const isPlainArrow = !event.ctrlKey && !event.metaKey && !event.altKey && !event.shiftKey;
      const isAltUnusedArrow = event.altKey && !event.ctrlKey && !event.metaKey && (event.key === "ArrowLeft" || event.key === "ArrowRight");
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key) || isTabShortcut || isPinShortcut || isBottomShortcut || isCollapseShortcut || isAltMoveUp || isAltMoveDown || isAltUnusedArrow) {
        event.preventDefault();
      }
      if (isPlainArrow && event.key === "ArrowUp") moveKeyboardSelection(-1);
      if (isPlainArrow && event.key === "ArrowDown") moveKeyboardSelection(1);
      if (isPlainArrow && event.key === "ArrowLeft") moveKeyboardCard(-1);
      if (isPlainArrow && event.key === "ArrowRight") moveKeyboardCard(1);
      if (isTabShortcut) moveKeyboardTab();
      if (event.key === " " && canWrite()) activateSelected();
      if (isPinShortcut && canWrite() && selectedTodoId()) moveTodoToEdge(selectedTodoId(), "top");
      if (isBottomShortcut && canWrite() && selectedTodoId()) moveTodoToEdge(selectedTodoId(), "bottom");
      if (isAltMoveUp && selectedTodoId() && canWrite()) moveSelectedTodo("up");
      if (isAltMoveDown && selectedTodoId() && canWrite()) moveSelectedTodo("down");
      if (isCollapseShortcut) collapseSelectedTodoGroup();
    }

    function moveKeyboardSelection(delta) {
      const items = keyboardNavigationItems();
      if (!items.length) {
        state.selected = null;
        render();
        return;
      }
      const foundIndex = items.findIndex((item) => isSameSelection(item, state.selected));
      const currentIndex = foundIndex >= 0 ? foundIndex : (delta > 0 ? -1 : 0);
      const nextIndex = (currentIndex + delta + items.length) % items.length;
      setSelection(items[nextIndex]);
    }

    function moveKeyboardCard(direction) {
      const cards = keyboardHorizontalCards();
      if (!cards.length) return;
      let cardIndex = cards.findIndex((card) => card.items.some((item) => isSameSelection(item, state.selected)));
      if (cardIndex < 0) cardIndex = 0;
      const card = cards[cardIndex];
      if (card.key === "counters") {
        const itemIndex = card.items.findIndex((item) => isSameSelection(item, state.selected));
        const targetIndex = itemIndex + direction;
        if (targetIndex >= 0 && targetIndex < card.items.length) {
          setSelection(card.items[targetIndex]);
          return;
        }
      }
      const nextCardIndex = (cardIndex + direction + cards.length) % cards.length;
      const nextCard = cards[nextCardIndex];
      setSelection(direction < 0 && nextCard.key === "counters" ? nextCard.items[nextCard.items.length - 1] : nextCard.items[0]);
    }

    function moveKeyboardTab() {
      const cards = keyboardCards();
      if (!cards.length) return;
      const currentCard = cards.findIndex((card) => card.items.some((item) => isSameSelection(item, state.selected)));
      const nextCard = (Math.max(0, currentCard) + 1) % cards.length;
      setSelection(cards[nextCard].items[0]);
    }

    function setSelection(selection) {
      if (!selection) {
        state.selected = null;
        render();
        return;
      }
      if (selection.type === "todo") {
        selectTodo(selection.id);
        return;
      }
      if (selection.type === "daily") {
        selectDailyTask(selection.id);
        return;
      }
      if (selection.type === "counter") {
        selectCounterItem(selection.id);
        return;
      }
      selectGroup(selection.key);
    }

    async function completeSelected(id) {

      const items = navigationItems();
      const currentIndex = Math.max(0, items.findIndex((item) => item.type === "todo" && item.id === id));
