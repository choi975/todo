    function parseAutomaticNewItem(value) {
      const text = normalizeTodoText(value);
      const daily = text.match(/^(?:每日|每天)\s*[:：]\s*(.*)$/);
      if (daily) return { type: "daily", text: normalizeTodoText(daily[1]) };
      const counter = text.match(/^累计\s*[:：]\s*(.*)$/);
      if (counter) return { type: "counter", text: normalizeTodoText(counter[1]) };
      const namedRelativeDay = text.match(/^(明天|后天)\s*[:：]?\s*(.*)$/);
      if (namedRelativeDay) {
        return {
          type: "",
          dueDate: addDays(state.today, namedRelativeDay[1] === "明天" ? 1 : 2),
          text: normalizeTodoText(namedRelativeDay[2]),
        };
      }
      const relativeDay = text.match(/^([0-9]{1,3}|[一二两三四五六七八九十]+)天后\s*[:：]?\s*(.*)$/);
      if (relativeDay) {
        const dayCount = parseRelativeDayCount(relativeDay[1]);
        if (Number.isInteger(dayCount) && dayCount >= 0) {
          return {
            type: "",
            dueDate: addDays(state.today, dayCount),
            text: normalizeTodoText(relativeDay[2]),
          };
        }
      }
      const weekday = text.match(/^(下周|下星期|周|星期)([一二三四五六日天])\s*[:：]?\s*(.*)$/);
      if (weekday) {
        return {
          type: "",
          dueDate: resolveWeekdayDate(weekday[2], weekday[1] === "下周" || weekday[1] === "下星期"),
          text: normalizeTodoText(weekday[3]),
        };
      }
      const monthDay = text.match(/^(\d{1,2})月(\d{1,2})[日号]/);
      const dueDate = monthDay ? resolveMonthDayDate(Number(monthDay[1]), Number(monthDay[2])) : "";
      return { type: "", dueDate, text };
    }

    function parseRelativeDayCount(value) {
      if (/^\d+$/.test(value)) return Number(value);
      const digits = { 一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
      if (digits[value]) return digits[value];
      const parts = value.split("十");
      if (parts.length !== 2) return NaN;
      const tens = parts[0] ? digits[parts[0]] : 1;
      const ones = parts[1] ? digits[parts[1]] : 0;
      return tens && Number.isInteger(ones) ? tens * 10 + ones : NaN;
    }

    function resolveWeekdayDate(weekday, nextWeek) {
      const targetDay = { 日: 0, 天: 0, 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6 }[weekday];
      const currentDay = parseDate(state.today).getDay();
      if (!nextWeek) return addDays(state.today, (targetDay - currentDay + 7) % 7);
      const daysUntilNextMonday = currentDay === 0 ? 1 : 8 - currentDay;
      const offsetFromMonday = targetDay === 0 ? 6 : targetDay - 1;
      return addDays(state.today, daysUntilNextMonday + offsetFromMonday);
    }

    function resolveMonthDayDate(month, day) {
      if (month < 1 || month > 12 || day < 1 || day > 31) return "";
      const today = parseDate(state.today);
      for (let year = today.getFullYear(); year <= today.getFullYear() + 8; year += 1) {
        const candidate = new Date(year, month - 1, day);
        if (candidate.getMonth() !== month - 1 || candidate.getDate() !== day || candidate < today) continue;
        return toLocalDateString(candidate);
      }
      return "";
    }

    function startEditingDailyTask(task) {
      if (!task || !canWrite()) return;
      state.selected = dailySelection(task.id);
      state.dailyEditingId = task.id;
      state.dailyEditingText = stripDailyTaskPrefix(task.text);
      state.pendingDailyEditFocusId = task.id;
      renderWorkbenchDaily();
    }

    function cancelDailyTaskEdit() {
      state.dailyEditingId = null;
      state.dailyEditingText = "";
      state.pendingDailyEditFocusId = null;
      renderWorkbenchDaily();
    }

    async function saveEditingDailyTask(task) {
      if (!task || state.dailyEditingId !== task.id || !canWrite()) return;
      const text = normalizeTodoText(state.dailyEditingText);
      const originalText = normalizeTodoText(stripDailyTaskPrefix(task.text));
      state.dailyEditingId = null;
      state.dailyEditingText = "";
      state.pendingDailyEditFocusId = null;
      if (!text) {
        renderWorkbenchDaily();
        setStatus("每日任务名称不能为空", true);
        return;
      }
      if (text === originalText) {
        renderWorkbenchDaily();
        return;
      }

      const current = state.dailyTasks.find((item) => item.id === task.id);
      if (current) current.text = text;
      renderWorkbenchDaily();
      enqueueMutation(() => apiPost("/api/daily-tasks/update", { id: task.id, text }), { key: `daily-update:${task.id}` });
    }

    async function deleteDailyTask(task) {
      if (!canWrite()) return;
      if (state.dailyEditingId === task.id) {
        state.dailyEditingId = null;
        state.dailyEditingText = "";
        state.pendingDailyEditFocusId = null;
      }
      state.dailyTasks = state.dailyTasks.filter((item) => item.id !== task.id);
      if (state.selected?.type === "daily" && state.selected.id === task.id) state.selected = null;
      renderWorkbenchDaily();
      enqueueMutation(() => apiPost("/api/daily-tasks/delete", { id: task.id }), { key: `daily-delete:${task.id}` });
    }

    function openModal() {
      if (!canWrite()) return;
      if (isCompletedOpen()) closeCompleted({ returnFocus: false });
      if (isCounterOpen()) closeCounter({ returnFocus: false });
      renderDateOptions();
      els.modalBackdrop.classList.add("open");
      window.setTimeout(() => {
        els.newText.focus();
        els.newText.select();
      }, 0);
    }

    function closeModal(options = {}) {
      els.modalBackdrop.classList.remove("open");
      if (options.returnFocus !== false) els.openNew.focus();
    }

    function openCompleted() {
      if (isNewModalOpen()) closeModal({ returnFocus: false });
      if (isCheckinOpen()) closeCheckin({ returnFocus: false });
      if (isCounterOpen()) closeCounter({ returnFocus: false });
      renderCompletedList();
      els.completedBackdrop.classList.add("open");
      void loadCompletedTodos();
      window.setTimeout(() => {
        const restoreButton = els.completedList.querySelector(".restore-button");
        (restoreButton || els.closeCompleted).focus();
      }, 0);
    }

    function closeCompleted(options = {}) {
      els.completedBackdrop.classList.remove("open");
      if (options.returnFocus !== false) els.openCompleted.focus();
    }

    function openCheckin(task) {
      if (!task || !canWrite()) return;
      if (isCompletedOpen()) closeCompleted({ returnFocus: false });
      if (isCounterOpen()) closeCounter({ returnFocus: false });
      state.checkinTaskId = task.id;
      renderCheckin();
      els.checkinBackdrop.classList.add("open");
      window.setTimeout(() => {
        const todayButton = els.checkinGrid.querySelector(".checkin-day.today") || els.checkinGrid.querySelector(".checkin-day");
        if (todayButton) todayButton.focus();
      }, 0);
    }

    function closeCheckin(options = {}) {
      els.checkinBackdrop.classList.remove("open");
      const taskId = state.checkinTaskId;
      state.checkinTaskId = null;
      if (options.returnFocus !== false) {
        const button = document.querySelector(`.daily-count-button[data-task-id="${CSS.escape(taskId || "")}"]`);
        if (button) button.focus();
      }
    }

    function renderCheckin() {
      const task = currentCheckinTask();
      els.checkinGrid.innerHTML = "";
      if (!task) return;

      const startDate = task.startDate || state.today;
      els.checkinTitle.textContent = stripDailyTaskPrefix(task.text);
      els.checkinSummary.textContent = `打卡统计：${formatDailyTaskStats(task)}，可补打卡范围：${formatShortDate(startDate)} 至 ${formatShortDate(state.today)}`;

      for (const name of CALENDAR_WEEKDAYS) {
        const weekday = document.createElement("div");
        weekday.className = "checkin-weekday";
        weekday.textContent = name;
        els.checkinGrid.appendChild(weekday);
      }

      const leading = (parseDate(startDate).getDay() + 6) % 7;
      for (let index = 0; index < leading; index += 1) {
        const spacer = document.createElement("div");
        spacer.className = "checkin-spacer";
        els.checkinGrid.appendChild(spacer);
      }

      const checkedDates = new Set(Array.isArray(task.checkins) ? task.checkins : []);
      for (let date = startDate; date <= state.today; date = addDays(date, 1)) {
        const parsedDate = parseDate(date);
        const button = document.createElement("button");
        const checked = checkedDates.has(date);
        button.className = "checkin-day";
        if (checked) button.classList.add("checked");
        if (date === state.today) button.classList.add("today");
        button.type = "button";
        button.dataset.date = date;
        button.setAttribute("aria-pressed", checked ? "true" : "false");
        button.setAttribute("aria-label", `${formatShortDate(date)} ${checked ? "已打卡" : "未打卡"}`);
        button.innerHTML = `
          <span class="checkin-date">${parsedDate.getMonth() + 1}/${parsedDate.getDate()}</span>
          <span class="checkin-mark">${checked ? "✓" : ""}</span>
        `;
        button.addEventListener("click", () => toggleDailyCheckin(task, date, !checked));
        els.checkinGrid.appendChild(button);
      }
    }

    async function toggleDailyCheckin(task, date, checked) {
      if (!task || !canWrite()) return;
      const checkins = new Set(Array.isArray(task.checkins) ? task.checkins : []);
      if (checked) {
        checkins.add(date);
      } else {
        checkins.delete(date);
      }
      task.checkins = Array.from(checkins).sort();
      task.completedCount = task.checkins.length;
      task.totalCount = Math.max(0, daysBetween(task.startDate || state.today, state.today) + 1);
      renderWorkbenchDaily();
      renderCheckin();
      enqueueMutation(() => apiPost("/api/daily-tasks/checkin", { id: task.id, date, checked, today: state.today }), { key: `daily-checkin:${task.id}:${date}:${checked}` });
    }

    function isNewModalOpen() {
      return els.modalBackdrop.classList.contains("open");
    }

    function isCheckinOpen() {
      return els.checkinBackdrop.classList.contains("open");
    }

    function isCompletedOpen() {
      return els.completedBackdrop.classList.contains("open");
    }

    function currentCheckinTask() {
      return state.dailyTasks.find((task) => task.id === state.checkinTaskId) || null;
    }

    function startEditingTodo(todo) {
      if (!todo || !canWrite()) return;
      endDrag();
      state.selected = todoSelection(todo.id);
      state.editingId = todo.id;
      state.editingText = todo.text;
      state.pendingEditFocusId = todo.id;
      render();
    }

    function cancelEditingTodo() {
      if (!state.editingId) return;
      clearEditingState();
      render();
    }

    async function saveEditingTodo(id, originalText) {
      if (!canWrite()) return;
      if (state.editingId !== id) return;
      const text = normalizeTodoText(state.editingText);
      clearEditingState();
      if (!text) {
        render();
        setStatus("待办事项不能为空", true);
        return;
      }

      const current = state.todos.find((todo) => todo.id === id);
      if (current) current.text = text;
      render();

      if (text === normalizeTodoText(originalText)) return;

      enqueueMutation(() => apiPost("/api/todos/update", { id, text, today: state.today }), { preferId: selectedTodoId() || id, key: `todo-update:${id}` });
    }

    function clearEditingState() {
      state.editingId = null;
      state.editingText = "";
      state.pendingEditFocusId = null;
    }

    function toggleGroup(key) {
      const collapsed = isCollapsed(key);
      state.collapsed[key] = !collapsed;
      saveCollapsed();
      render();
    }

    function selectTodo(id, options = {}) {
      state.selected = todoSelection(id);
      if (options.renderNow !== false) render();
      const node = document.querySelector(`.todo[data-id="${CSS.escape(id)}"]`);
      if (node) node.scrollIntoView({ block: "nearest" });
    }

    function selectDailyTask(id, options = {}) {
      state.selected = dailySelection(id);
      if (options.renderNow !== false) render();
      const node = document.querySelector(`.daily-row[data-daily-id="${CSS.escape(id)}"]`);
      if (node) node.scrollIntoView({ block: "nearest" });
    }

    function selectCounterItem(id, options = {}) {
      state.selected = counterSelection(id);
      if (options.renderNow !== false) render();
      const node = document.querySelector(`.counter-home-item[data-counter-item-id="${CSS.escape(id)}"]`);
      if (node) node.scrollIntoView({ block: "nearest" });
    }

    function selectionNode(selection) {
      if (!selection) return null;
      if (selection.type === "todo") return document.querySelector(`.todo[data-id="${CSS.escape(selection.id)}"]`);
      if (selection.type === "daily") return document.querySelector(`.daily-row[data-daily-id="${CSS.escape(selection.id)}"]`);
      if (selection.type === "counter") return document.querySelector(`.counter-home-item[data-counter-item-id="${CSS.escape(selection.id)}"]`);
      return null;
    }

    function selectGroup(key, options = {}) {
      state.selected = groupSelection(key);
      if (options.renderNow !== false) render();
      const node = document.querySelector(`.day[data-date="${CSS.escape(key)}"] .day-header`);
      if (node) node.scrollIntoView({ block: "nearest" });
    }

    function ensureSelected(preferId) {
      const items = keyboardNavigationItems();
      if (preferId && items.some((item) => item.type === "todo" && item.id === preferId)) {
        state.selected = todoSelection(preferId);
        return;
      }
      if (state.selected && items.some((item) => isSameSelection(item, state.selected))) return;
      const todayFirst = items.find((item) => item.type === "todo" && todoById(item.id)?.dueDate === state.today);
      state.selected = todayFirst || items[0] || null;
    }

    function visibleTodos() {
      return workbenchDisplayedTodos();
    }

    function navigationItems() {
      return workbenchDisplayedTodos().map((todo) => todoSelection(todo.id));
    }

    function keyboardNavigationItems() {
      return keyboardCards().flatMap((card) => card.items);
    }

    function keyboardHorizontalCards() {
      const cards = keyboardCards();
      const byKey = new Map(cards.map((card) => [card.key, card]));
      return ["prefix", "today", "shopping", "daily", "counters"].map((key) => byKey.get(key)).filter(Boolean);
    }

    function keyboardCards() {
      const prefix = prefixGroupsForWorkbench().flatMap((group) => group.todos).map((todo) => todoSelection(todo.id));
      const today = ordinaryTodosForDate(state.today).map((todo) => todoSelection(todo.id));
      const daily = [...state.dailyTasks]
        .sort((left, right) => Number(left.sortOrder) - Number(right.sortOrder))
        .map((task) => dailySelection(task.id));
      const shopping = shoppingTodosForWorkbench().map((todo) => todoSelection(todo.id));
      const active = state.counterItems
        .filter((item) => Number(item.active ?? 1))
        .sort((left, right) => Number(left.sortOrder) - Number(right.sortOrder));
      const pinned = active.filter((item) => Number(item.pinned));
      const counters = (pinned.length ? pinned : active).slice(0, 3).map((item) => counterSelection(item.id));
      return [
        { key: "prefix", items: prefix },
        { key: "today", items: today },
        { key: "daily", items: daily },
        { key: "shopping", items: shopping },
        { key: "counters", items: counters },
      ].filter((card) => card.items.length);
    }

    function workbenchDisplayedTodos() {
      const todos = [];
      const seen = new Set();
      const append = (todo) => {
        if (!todo || seen.has(todo.id)) return;
        seen.add(todo.id);
        todos.push(todo);
      };
      for (const group of prefixGroupsForWorkbench()) {
        for (const todo of group.todos) append(todo);
      }
      for (const todo of ordinaryTodosForDate(state.today)) append(todo);
      for (let offset = 1; offset < DAY_COUNT; offset += 1) {
        for (const todo of ordinaryTodosForDate(addDays(state.today, offset))) append(todo);
      }
      for (const todo of shoppingTodosForWorkbench()) append(todo);
      return todos;
    }

    function todoSelection(id) {
      return { type: "todo", id };
    }

    function dailySelection(id) {
      return { type: "daily", id };
    }

    function counterSelection(id) {
      return { type: "counter", id };
    }

    function groupSelection(key) {
      return { type: "group", key };
    }

    function isSameSelection(a, b) {
      if (!a || !b || a.type !== b.type) return false;
      return a.type === "group" ? a.key === b.key : a.id === b.id;
    }

    function isSelectedTodo(id) {
      return state.selected?.type === "todo" && state.selected.id === id;
    }

    function isSelectedDailyTask(id) {
      return state.selected?.type === "daily" && state.selected.id === id;
    }

    function isSelectedCounterItem(id) {
      return state.selected?.type === "counter" && state.selected.id === id;
    }

    function isSelectedGroup(key = null) {
      if (key === null) return state.selected?.type === "group";
      return state.selected?.type === "group" && state.selected.key === key;
    }

    function selectedTodoId() {
      return state.selected?.type === "todo" ? state.selected.id : null;
    }

    function selectedTodo() {
      const id = selectedTodoId();
      return id ? todoById(id) : null;
    }

    function todoById(id) {
      return state.todos.find((todo) => todo.id === id) || null;
    }

    function groupKeyForTodo(todo) {
      return todo?.dueDate || state.today;
    }

    function todosForGroup(key) {
      return state.todos.filter((todo) => todo.dueDate === key).sort(sortTodos);
    }

    function orderedDates() {
      return Array.from({ length: DAY_COUNT }, (_, offset) => ({
        date: addDays(state.today, offset),
        offset,
      }));
    }

    function sortTodos(a, b) {
      return groupSortValue(a.dueDate) - groupSortValue(b.dueDate) || Number(a.sortOrder) - Number(b.sortOrder) || a.createdAt.localeCompare(b.createdAt);
    }

    function groupSortValue(key) {
      if (key === SHOPPING_GROUP) return -1;
      return parseDate(key).getTime();
    }

    function optimisticallyMove(id, direction) {
      const todo = todoById(id);
      if (!todo) return;
      const date = todo.dueDate;
      const rows = todoRowsForDate(date);
      const reordered = moveTodoRowByStep(rows, id, direction);
      writeTodoOrderForDate(date, reordered);
    }

    function optimisticallyMoveToEdge(id, edge) {
      const todo = todoById(id);
      if (!todo) return;
      const date = todo.dueDate;
      const rows = todoRowsForDate(date);
      const reordered = moveTodoRowToEdge(rows, id, edge);
      writeTodoOrderForDate(date, reordered);
    }

    function writeDaySortOrders(orderedTodos) {
      orderedTodos.forEach((todo, index) => {
        todo.sortOrder = index * 1000;
      });
    }

    function handleDragOver(event) {
      if (!canWrite() || !state.draggingId || state.editingId) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      const list = event.currentTarget;
      const target = resolveDropTarget(list, event.clientY, state.draggingId);
      setDropIndicator(list, target);
    }

    async function handleDrop(event) {
      event.preventDefault();
      if (!canWrite() || state.editingId) return;
      const id = event.dataTransfer.getData("text/plain") || state.draggingId;
      if (!id) return;
      const list = event.currentTarget;
      const target = resolveDropTarget(list, event.clientY, id);
      const date = list.dataset.date;
      const sameDay = todosForGroup(date);
      const fromIndex = sameDay.findIndex((todo) => todo.id === id);
      if (fromIndex < 0) {
        endDrag();
        return;
      }
      if (!target || !target.targetId) {
        endDrag();
        return;
      }
      const filtered = sameDay.filter((todo) => todo.id !== id);
      const targetIndex = filtered.findIndex((todo) => todo.id === target.targetId);
      if (targetIndex < 0) {
        endDrag();
        return;
      }
      const desiredIndex = target.side === "after" ? targetIndex + 1 : targetIndex;
      if (desiredIndex === fromIndex) {
        endDrag();
        return;
      }
      const direction = desiredIndex < fromIndex ? "up" : "down";
      const steps = Math.abs(desiredIndex - fromIndex);
      state.selected = todoSelection(id);
      endDrag();
      for (let i = 0; i < steps; i++) optimisticallyMove(id, direction);
      render();
      enqueueMutation(async () => {
        for (let i = 0; i < steps; i++) {
          await apiPost("/api/todos/move", { id, direction, today: state.today });
        }
      }, { preferId: id, key: `todo-drag:${id}:${direction}:${steps}` });
    }

    function resolveDropTarget(list, clientY, draggingId) {
      const rows = Array.from(list.querySelectorAll(".todo")).filter((row) => row.dataset.id !== draggingId);
      if (!rows.length) return null;
      for (const row of rows) {
        const rect = row.getBoundingClientRect();
        if (clientY < rect.top + rect.height / 2) {
          return { targetId: row.dataset.id, side: "before" };
        }
      }
      return { targetId: rows[rows.length - 1].dataset.id, side: "after" };
    }

    function setDropIndicator(list, target) {
      if (state.dropTargetId === target?.targetId && state.dropSide === target?.side && state.dropDate === list.dataset.date) return;
      clearDropIndicator();
      state.dropDate = list.dataset.date;
      if (!target) {
        list.classList.add("drop-empty");
        return;
      }
      state.dropTargetId = target.targetId;
      state.dropSide = target.side;
      const row = document.querySelector(`.todo[data-id="${CSS.escape(target.targetId)}"]`);
      if (row) {
        row.classList.add("drop-target");
        row.classList.add(target.side === "before" ? "drop-before" : "drop-after");
      }
    }

    function clearDropIndicator() {
      if (state.dropDate) {
        const list = document.querySelector(`[data-date="${CSS.escape(state.dropDate)}"]`);
        if (list) list.classList.remove("drop-empty");
      }
      if (state.dropTargetId) {
        const row = document.querySelector(`.todo[data-id="${CSS.escape(state.dropTargetId)}"]`);
        if (row) {
          row.classList.remove("drop-target", "drop-before", "drop-after");
        }
      }
      state.dropTargetId = null;
      state.dropSide = null;
      state.dropDate = null;
    }

    function endDrag() {
      clearDropIndicator();
      document.querySelectorAll(".todo.dragging").forEach((row) => row.classList.remove("dragging"));
      state.draggingId = null;
    }

    function focusEditingInput() {
      if (!state.pendingEditFocusId) return;
      const id = state.pendingEditFocusId;
      const input = document.querySelector(`.todo[data-id="${CSS.escape(id)}"] .todo-input`);
      if (!input) return;
      state.pendingEditFocusId = null;
      window.requestAnimationFrame(() => {
        if (state.editingId !== id) return;
        input.focus();
        input.select();
      });
    }

    function isCollapsed(key, offset = null) {
      if (Object.prototype.hasOwnProperty.call(state.collapsed, key)) return state.collapsed[key];
      if (key === SHOPPING_GROUP) return true;
      const resolvedOffset = offset ?? daysFromToday(key);
      return resolvedOffset > 2;
    }

    function groupLabel(date, offset) {
      if (offset === 0) return "今天";
      if (offset === 1) return "明天";
      if (offset === 2) return "后天";
      const parsed = parseDate(date);
      return `星期${WEEKDAYS[parsed.getDay()]}（${parsed.getFullYear()}年${parsed.getMonth() + 1}月${parsed.getDate()}日）`;
    }

    function createOptionLabel(date, offset) {
      const parsed = parseDate(date);
      const suffix = `（${parsed.getFullYear()}年${parsed.getMonth() + 1}月${parsed.getDate()}日）`;
      if (offset === 0) return "今天" + suffix;
      if (offset === 1) return "明天" + suffix;
      if (offset === 2) return "后天" + suffix;
      return `${offset}天后${suffix}`;
    }

    function formatFullDate(date) {
      const parsed = parseDate(date);
      return `${parsed.getFullYear()}年${parsed.getMonth() + 1}月${parsed.getDate()}日 星期${WEEKDAYS[parsed.getDay()]}`;
    }

    function formatShortDate(date) {
      const parsed = parseDate(date);
      return `${parsed.getFullYear()}年${parsed.getMonth() + 1}月${parsed.getDate()}日`;
    }

    function formatCompletedDueDate(value) {
      if (value === SHOPPING_GROUP) return "购物清单";
      if (!isDateString(value)) return "未知日期";
      const offset = daysFromToday(value);
      if (offset === 0) return "今天";
      if (offset === 1) return "明天";
      if (offset === 2) return "后天";
      return formatShortDate(value);
    }

    function formatTimestamp(value) {
      if (!value) return "未知时间";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      const hour = String(date.getHours()).padStart(2, "0");
      const minute = String(date.getMinutes()).padStart(2, "0");
      return `${year}年${month}月${day}日 ${hour}:${minute}`;
    }

    function parseDate(value) {
      const [year, month, day] = value.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function toLocalDateString(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function addDays(value, days) {
      const date = parseDate(value);
      date.setDate(date.getDate() + days);
      return toLocalDateString(date);
    }

    function daysFromToday(value) {
      if (value === SHOPPING_GROUP) return -1;
      return Math.round((parseDate(value).getTime() - parseDate(state.today).getTime()) / 86400000);
    }

    function daysBetween(startDate, endDate) {
      return Math.round((parseDate(endDate).getTime() - parseDate(startDate).getTime()) / 86400000);
    }

    function normalizeTodoText(value) {
      return String(value || "").trim().replace(/\s+/g, " ").slice(0, 240);
    }

    function stripDailyTaskPrefix(value) {
      return String(value || "").replace(/^（每日任务）/, "");
    }

    function isDateString(value) {
      return typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value);
    }

    function setStatus(message, error = false, options = {}) {
      window.clearTimeout(setStatus.timer);
      els.status.textContent = "";
      const text = document.createElement("span");
      text.textContent = message;
      els.status.appendChild(text);
      els.status.classList.toggle("error", error);
      els.status.classList.toggle("cache-status", Boolean(options.cache));
      if (options.retry) {
        const retry = document.createElement("button");
        retry.className = "retry-sync";
        retry.type = "button";
        retry.textContent = "重试";
        retry.addEventListener("click", () => void refresh({ initial: true }));
        els.status.appendChild(retry);
      }
      if (!error && message === "已同步") {
        setStatus.timer = window.setTimeout(() => {
          if (els.status.textContent === "已同步") els.status.textContent = "";
        }, 1400);
      }
    }

    function canWrite() {
      return !state.readOnly;
    }

    function setReadOnly(readOnly) {
      state.readOnly = Boolean(readOnly);
      document.body.classList.toggle("read-only", state.readOnly);
      updateInteractionState();
    }

    function updateInteractionState() {
      if (!els.openNew) return;
      els.openNew.disabled = state.readOnly;
      els.openNew.title = state.readOnly ? "等待同步完成后可新建" : "新建（Alt+N）";
      els.openNew.setAttribute("aria-label", state.readOnly ? "等待同步完成后可新建" : "新建待办事项");
      if (els.openCounterItem) els.openCounterItem.disabled = state.readOnly;
      if (els.openCounterRecord) els.openCounterRecord.disabled = state.readOnly;
    }

    function saveStateCache() {
      try {
        const payload = {
          version: STATE_CACHE_VERSION,
          savedAt: state.cacheSavedAt || new Date().toISOString(),
          today: state.today,
          days: DAY_COUNT,
          todos: state.todos,
          dailyTasks: state.dailyTasks,
          completedCount: state.completedCount,
          counterItems: state.counterItems,
        };
        localStorage.setItem(STATE_CACHE_KEY, JSON.stringify(payload));
      } catch {
        // Storage may be disabled or full; live synchronization still works.
      }
    }

    function restoreStateCache() {
      try {
        const raw = JSON.parse(localStorage.getItem(STATE_CACHE_KEY) || "null");
        if (!raw || raw.version !== STATE_CACHE_VERSION || !Array.isArray(raw.todos) || !Array.isArray(raw.dailyTasks)) return false;
        const today = state.today;
        const dailySourcesShownToday = new Set(raw.todos
          .filter((todo) => todo.sourceDailyTaskId && todo.dueDate === today)
          .map((todo) => todo.sourceDailyTaskId));
        state.todos = raw.todos.flatMap((todo) => {
          const copy = { ...todo };
          if (copy.dueDate === SHOPPING_GROUP || (isDateString(copy.dueDate) && copy.dueDate >= today)) return [copy];
          if (copy.sourceDailyTaskId) {
            if (dailySourcesShownToday.has(copy.sourceDailyTaskId)) return [];
            dailySourcesShownToday.add(copy.sourceDailyTaskId);
          }
          copy.dueDate = today;
          return [copy];
        });
        state.dailyTasks = raw.dailyTasks;
        state.completedCount = Number(raw.completedCount) || 0;
        state.counterItems = (Array.isArray(raw.counterItems) ? raw.counterItems : []).map((item) => ({ ...item, kind: "count", unit: "次", incrementValue: 1 }));
        state.cacheSavedAt = typeof raw.savedAt === "string" ? raw.savedAt : null;
        state.cacheLoaded = true;
        setReadOnly(true);
        setStatus(`正在同步，当前显示${formatCacheAge(state.cacheSavedAt)}的缓存（只读）`, false, { cache: true });
        return true;
      } catch {
        return false;
      }
    }

    function formatCacheAge(savedAt) {
      if (!savedAt) return "上次";
      const date = new Date(savedAt);
      if (Number.isNaN(date.getTime())) return "上次";
      return `上次同步于 ${date.toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}`;
    }

    async function apiGet(path) {
      const token = sessionToken();
      const response = await fetch(API_BASE + path, {
        headers: token ? { "X-Todo-Session": token } : {},
        cache: "no-store",
      });
      return parseApiResponse(response);
    }

    async function apiPost(path, body, options = {}) {
      const token = sessionToken();
      const response = await fetch(API_BASE + path, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...(token ? { "X-Todo-Session": token } : {}),
        },
        body: JSON.stringify(body),
        keepalive: Boolean(options.keepalive),
      });
      return parseApiResponse(response);
    }

    async function parseApiResponse(response) {
      const data = await response.json().catch(() => ({}));
      if (response.status === 401) {
        handleSessionExpired();
        const error = new Error(data.error || "unauthorized");
        error.unauthorized = true;
        throw error;
      }
      if (!response.ok) throw new Error(data.error || response.statusText || "请求失败");
      return data;
    }

    function loadCollapsed() {
      try {
        return JSON.parse(localStorage.getItem("todo-collapsed-days") || "{}");
      } catch {
        return {};
      }
    }

    function loadCounterSelection() {
      try {
        const raw = JSON.parse(localStorage.getItem(COUNTER_SELECTION_KEY) || "null");
        if (raw && typeof raw === "object" && !Array.isArray(raw)) return raw;
      } catch {
        // Storage may be disabled; fall back to default behavior.
      }
      return {};
    }

    function saveCounterSelection() {
      try {
        localStorage.setItem(COUNTER_SELECTION_KEY, JSON.stringify(state.counterSelectionMap));
      } catch {
        // Storage may be disabled or full; the current session still works.
      }
    }

    function syncCounterSelection() {
      const known = new Set(state.counterItems.map((item) => item.id));
      for (const id of Object.keys(state.counterSelectionMap)) {
        if (!known.has(id)) delete state.counterSelectionMap[id];
      }
      state.counterSelectedIds = state.counterItems
        .filter((item) => state.counterSelectionMap[item.id] !== false)
        .map((item) => item.id);
    }

    function saveCollapsed() {
      localStorage.setItem("todo-collapsed-days", JSON.stringify(state.collapsed));
    }

    function isTextEntryTarget(target) {
      return Boolean(target && target.closest && target.closest("input, textarea, select"));
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function localId() {
      state.localCounter += 1;
      return `${LOCAL_ID_PREFIX}${Date.now().toString(36)}-${state.localCounter}`;
    }

    function isLocalId(value) {
      return typeof value === "string" && value.startsWith(LOCAL_ID_PREFIX);
    }

    function scheduleSave() {
      window.clearTimeout(state.saveTimer);
      state.dirty = true;
      state.saveTimer = window.setTimeout(flushPendingMutations, SAVE_DEBOUNCE_MS);
    }

    function enqueueMutation(run, options = {}) {
      if (!canWrite()) return false;
      state.pendingMutations.push({ run, key: options.key || null });
      if (options.preferId && !state.pendingPreferId) state.pendingPreferId = options.preferId;
      scheduleSave();
      return true;
    }

    function cancelQueuedMutation(key) {
      if (!key) return false;
      const index = state.pendingMutations.findIndex((mutation) => mutation.key === key);
      if (index < 0) return false;
      state.pendingMutations.splice(index, 1);
      if (!state.pendingMutations.length) {
        window.clearTimeout(state.saveTimer);
        state.dirty = false;
        state.pendingPreferId = null;
      }
      return true;
    }

    async function flushPendingMutations() {
      if (state.flushing) {
        state.flushRequested = true;
        return;
      }
      if (!state.pendingMutations.length) {
        state.dirty = false;
        state.pendingPreferId = null;
        return;
      }

      state.flushing = true;
      state.flushRequested = false;
      const batch = state.pendingMutations.splice(0);
      const preferId = state.pendingPreferId;
      state.pendingPreferId = null;
      state.dirty = false;

      setStatus("保存中...");
      let firstError = null;
      for (const mutation of batch) {
        try {
          await mutation.run();
        } catch (error) {
          firstError = firstError || error;
        }
      }

      if (firstError) {
        setStatus("保存失败：" + firstError.message, true);
      } else {
        setStatus("已保存");
      }

      state.flushing = false;

      if (state.pendingMutations.length) {
        scheduleSave();
        return;
      }

      if (state.flushRequested) {
        state.flushRequested = false;
        scheduleSave();
        return;
      }

      await refresh({ preferId });
    }

    function todoRowsForDate(date) {
      return state.todos
        .filter((todo) => todo.dueDate === date)
        .sort(sortTodos);
    }

    function writeTodoOrderForDate(date, orderedRows) {
      const orderById = new Map(orderedRows.map((row, index) => [row.id, index * 1000]));
      for (const todo of state.todos) {
        if (todo.dueDate === date && orderById.has(todo.id)) todo.sortOrder = orderById.get(todo.id);
      }
    }

    function partitionTodoRows(rows) {
      const topDaily = [];
      const bottomDaily = [];
      const prefixGroups = new Map();
      const prefixOrder = [];
      const regular = [];

      for (const row of rows) {
        const placement = row.sourceDailyTaskId ? "top" : null;
        if (placement === "top") {
          topDaily.push(row);
          continue;
        }

        const prefix = prefixInfo(row)?.key || "";
        if (!prefix) {
          regular.push(row);
          continue;
        }
        if (!prefixGroups.has(prefix)) {
          prefixGroups.set(prefix, { key: prefix, rows: [] });
          prefixOrder.push(prefix);
        }
        prefixGroups.get(prefix).rows.push(row);
      }

      return {
        topDaily,
        prefixGroups: prefixOrder.map((prefix) => prefixGroups.get(prefix)),
        regular,
        bottomDaily,
      };
    }

    function flattenTodoParts(parts) {
      return parts.topDaily
        .concat(...parts.prefixGroups.map((group) => group.rows))
        .concat(parts.regular, parts.bottomDaily);
    }

    function locateTodoPrefixRow(parts, id) {
      for (let groupIndex = 0; groupIndex < parts.prefixGroups.length; groupIndex += 1) {
        const rowIndex = parts.prefixGroups[groupIndex].rows.findIndex((row) => row.id === id);
        if (rowIndex >= 0) return { groupIndex, rowIndex };
      }
      return null;
    }

    function moveTodoRowByStep(rows, id, direction) {
      const parts = partitionTodoRows(rows);
      const dailyMoved = moveLocalRowsByStep(parts.topDaily, id, direction) || moveLocalRowsByStep(parts.bottomDaily, id, direction);
      if (dailyMoved) return flattenTodoParts(parts);

      const located = locateTodoPrefixRow(parts, id);
      if (located) {
        const group = parts.prefixGroups[located.groupIndex];
        if (direction === "up") {
          if (located.rowIndex > 0) {
            const [row] = group.rows.splice(located.rowIndex, 1);
            group.rows.splice(located.rowIndex - 1, 0, row);
            return flattenTodoParts(parts);
          }
          if (located.groupIndex > 0) {
            const [movedGroup] = parts.prefixGroups.splice(located.groupIndex, 1);
            parts.prefixGroups.splice(located.groupIndex - 1, 0, movedGroup);
            return flattenTodoParts(parts);
          }
          return rows;
        }
        if (located.rowIndex < group.rows.length - 1) {
          const [row] = group.rows.splice(located.rowIndex, 1);
          group.rows.splice(located.rowIndex + 1, 0, row);
          return flattenTodoParts(parts);
        }
        if (located.groupIndex < parts.prefixGroups.length - 1) {
          const [movedGroup] = parts.prefixGroups.splice(located.groupIndex, 1);
          parts.prefixGroups.splice(located.groupIndex + 1, 0, movedGroup);
          return flattenTodoParts(parts);
        }
        return rows;
      }

      const regularIndex = parts.regular.findIndex((row) => row.id === id);
      if (regularIndex < 0) return rows;
      const targetIndex = direction === "up" ? regularIndex - 1 : regularIndex + 1;
      if (targetIndex < 0 || targetIndex >= parts.regular.length) return rows;
      const [row] = parts.regular.splice(regularIndex, 1);
      parts.regular.splice(targetIndex, 0, row);
      return flattenTodoParts(parts);
    }

    function moveTodoRowToEdge(rows, id, edge) {
      const parts = partitionTodoRows(rows);
      const located = locateTodoPrefixRow(parts, id);
      if (located) {
        const group = parts.prefixGroups[located.groupIndex];
        const [row] = group.rows.splice(located.rowIndex, 1);
        if (edge === "top") {
          group.rows.unshift(row);
          if (located.rowIndex === 0 && located.groupIndex > 0) {
            const [movedGroup] = parts.prefixGroups.splice(located.groupIndex, 1);
            parts.prefixGroups.splice(located.groupIndex - 1, 0, movedGroup);
          }
        } else {
          const wasLast = located.rowIndex === group.rows.length;
          group.rows.push(row);
          if (wasLast && located.groupIndex < parts.prefixGroups.length - 1) {
            const [movedGroup] = parts.prefixGroups.splice(located.groupIndex, 1);
            parts.prefixGroups.splice(located.groupIndex + 1, 0, movedGroup);
          }
        }
        return flattenTodoParts(parts);
      }

      const regularIndex = parts.regular.findIndex((row) => row.id === id);
      if (regularIndex < 0) return rows;
      if ((edge === "top" && regularIndex === 0) || (edge === "bottom" && regularIndex === parts.regular.length - 1)) return rows;
      const [row] = parts.regular.splice(regularIndex, 1);
      if (edge === "bottom") {
        parts.regular.push(row);
      } else {
        parts.regular.unshift(row);
      }
      return flattenTodoParts(parts);
    }

    function moveLocalRowsByStep(rows, id, direction) {
      const index = rows.findIndex((row) => row.id === id);
      if (index < 0) return false;
      const targetIndex = direction === "up" ? index - 1 : index + 1;
      if (targetIndex < 0 || targetIndex >= rows.length) return false;
      const [row] = rows.splice(index, 1);
      rows.splice(targetIndex, 0, row);
      return true;
    }

    function resolveLocalSelection() {
      const selection = state.selected;
      if (!selection) return;
      if (selection.type === "todo" && state.localTodoRealByTempId.has(selection.id)) {
        selection.id = state.localTodoRealByTempId.get(selection.id);
      }
      if (selection.type === "daily" && state.localDailyRealByTempId.has(selection.id)) {
        selection.id = state.localDailyRealByTempId.get(selection.id);
      }
      if (selection.type === "counter" && state.localCounterRealByTempId.has(selection.id)) {
        selection.id = state.localCounterRealByTempId.get(selection.id);
      }
    }

    function resolveCounterSelectionMap() {
      for (const [tempId, realId] of state.localCounterRealByTempId) {
        if (state.counterSelectionMap[tempId]) {
          delete state.counterSelectionMap[tempId];
          state.counterSelectionMap[realId] = true;
        }
      }
    }

    function createLocalTodo(text, dueDate) {
      const id = localId();
      const todo = {
        id,
        text,
        dueDate,
        sortOrder: Date.now(),
        sourceDailyTaskId: null,
        createdAt: new Date().toISOString(),
        __local: true,
      };
      state.todos.push(todo);
      state.localTodoByTempId.set(id, { text, dueDate });
      return todo;
    }

    function createLocalDailyTask(text) {
      const id = localId();
      const task = {
        id,
        text: "（每日任务）" + text,
        sortOrder: Date.now(),
        startDate: state.today,
        checkins: [],
        completedCount: 0,
        totalCount: 0,
        createdAt: new Date().toISOString(),
        __local: true,
      };
      state.dailyTasks.push(task);
      state.localDailyByTempId.set(id, { text });
      return task;
    }

    function createLocalCounterItem(name) {
      const id = localId();
      const item = {
        id,
        name,
        kind: "count",
        unit: "次",
        incrementValue: 1,
        color: COUNTER_COLORS[0],
        pinned: 1,
        sortOrder: Date.now(),
        active: 1,
        todayTotal: 0,
        createdAt: new Date().toISOString(),
        __local: true,
      };
      state.counterItems.push(item);
      state.counterSelectionMap[id] = true;
      state.localCounterByTempId.set(id, { name });
      return item;
    }
  </script>
