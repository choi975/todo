<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f4ec;
      --surface: #fffdfa;
      --line: #ddd4c3;
      --line-strong: #b8aa93;
      --text: #241f1a;
      --muted: #706759;
      --accent: #256d85;
      --accent-soft: #d9eef2;
      --complete: #2f7d4f;
      --shadow: 0 18px 48px rgba(50, 42, 30, 0.14);
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, rgba(37, 109, 133, 0.08), transparent 220px),
        var(--bg);
      color: var(--text);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      width: min(920px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0 52px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0 14px;
      background: linear-gradient(180deg, rgba(247, 244, 236, 0.96), rgba(247, 244, 236, 0.86));
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1;
      letter-spacing: 0;
      font-weight: 780;
    }

    .date-stamp {
      color: var(--muted);
      font-size: 15px;
      white-space: nowrap;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .home-button,
    .add-button,
    .completed-button,
    .daily-button {
      width: 46px;
      height: 46px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(42, 34, 24, 0.1);
      text-decoration: none;
    }

    .add-button {
      font-size: 0;
    }

    .completed-button {
      position: relative;
    }

    .home-button:hover,
    .home-button:focus-visible,
    .add-button:hover,
    .add-button:focus-visible,
    .completed-button:hover,
    .completed-button:focus-visible,
    .daily-button:hover,
    .daily-button:focus-visible {
      border-color: var(--accent);
      outline: 3px solid rgba(37, 109, 133, 0.18);
    }

    .home-button svg,
    .add-button svg,
    .completed-button svg,
    .daily-button svg {
      width: 24px;
      height: 24px;
      stroke-width: 2.4;
    }

    .status {
      min-height: 24px;
      color: var(--muted);
      font-size: 14px;
      padding: 4px 2px 14px;
    }

    .status.error {
      color: #9b2c20;
    }

    .status.cache-status {
      color: #76520f;
    }

    .status.error.cache-status {
      color: #9b2c20;
    }

    .retry-sync {
      margin-left: 8px;
      border: 1px solid currentColor;
      border-radius: 7px;
      background: transparent;
      color: inherit;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    body.read-only .todo {
      cursor: default;
    }

    body.read-only .checkbox,
    body.read-only .todo-action,
    body.read-only .daily-count-button,
    body.read-only .daily-actions button,
    body.read-only .counter-shortcut,
    body.read-only .counter-quick-add,
    body.read-only .counter-record-delete,
    body.read-only .restore-button {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .groups {
      display: grid;
      gap: 12px;
    }

    .day {
      background: rgba(255, 253, 250, 0.78);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 26px rgba(62, 50, 35, 0.08);
    }

    .day-header {
      width: 100%;
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 56px;
      padding: 0 18px;
      cursor: pointer;
      color: var(--text);
      text-align: left;
    }

    .day-header:hover,
    .day-header:focus-visible {
      outline: none;
      background: rgba(37, 109, 133, 0.07);
    }

    .day-header.selected {
      background: var(--accent-soft);
      box-shadow: inset 4px 0 0 var(--accent);
    }

    .day-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-weight: 760;
      font-size: 18px;
    }

    .chevron {
      width: 16px;
      height: 16px;
      transition: transform 150ms ease;
      flex: 0 0 auto;
    }

    .day.collapsed .chevron {
      transform: rotate(-90deg);
    }

    .day-count {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .todo-list {
      display: grid;
      gap: 1px;
      padding: 0 10px 10px;
    }

    .day.collapsed .todo-list {
      display: none;
    }

    .todo {
      position: relative;
      display: grid;
      grid-template-columns: 34px 1fr;
      align-items: center;
      min-height: 48px;
      border-radius: 8px;
      padding: 3px 80px 3px 8px;
      background: transparent;
      border: 1px solid transparent;
      cursor: grab;
      user-select: none;
    }

    .todo:hover {
      background: rgba(36, 31, 26, 0.04);
    }

    .todo.selected {
      background: var(--accent-soft);
      border-color: rgba(37, 109, 133, 0.42);
      box-shadow: inset 4px 0 0 var(--accent);
    }

    .todo.dragging {
      opacity: 0.48;
      cursor: grabbing;
    }

    .todo.editing {
      cursor: default;
      user-select: text;
    }

    .todo.drop-before::before,
    .todo.drop-after::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      height: 3px;
      border-radius: 999px;
      background: var(--accent);
      pointer-events: none;
    }

    .todo.drop-before::before {
      top: -2px;
    }

    .todo.drop-after::after {
      bottom: -2px;
    }

    .todo.drop-target {
      background: rgba(37, 109, 133, 0.08);
    }

    .todo-list.drop-empty {
      outline: 2px dashed rgba(37, 109, 133, 0.35);
      outline-offset: -6px;
    }

    .checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid var(--line-strong);
      border-radius: 4px;
      background: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }

    .checkbox:hover,
    .checkbox:focus-visible {
      border-color: var(--complete);
      outline: 3px solid rgba(47, 125, 79, 0.16);
    }

    .todo-text {
      font-size: 17px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .todo-input {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 7px 10px;
      background: #fff;
      color: var(--text);
      font-size: 17px;
      line-height: 1.35;
    }

    .todo-input:focus {
      outline: 3px solid rgba(37, 109, 133, 0.2);
      border-color: var(--accent);
    }

    .todo-actions {
      position: absolute;
      top: 50%;
      right: 8px;
      display: flex;
      gap: 4px;
      transform: translateY(-50%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease;
    }

    .todo-action {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 6px;
      background: rgba(37, 109, 133, 0.1);
      color: var(--accent);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: opacity 140ms ease, background 140ms ease, color 140ms ease;
    }

    .todo:hover .todo-actions,
    .todo.selected .todo-actions,
    .todo:focus-within .todo-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .todo-action:hover,
    .todo-action:focus-visible {
      background: rgba(37, 109, 133, 0.18);
      outline: 3px solid rgba(37, 109, 133, 0.16);
    }

    .empty {
      padding: 7px 10px 12px 42px;
      color: var(--muted);
      font-size: 15px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(36, 31, 26, 0.34);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(560px, 100%);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: 0 16px 0 20px;
      border-bottom: 1px solid var(--line);
    }

    .modal-title {
      font-weight: 760;
      font-size: 19px;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--text);
    }

    .icon-button:hover,
    .icon-button:focus-visible {
      background: rgba(36, 31, 26, 0.06);
      outline: 3px solid rgba(37, 109, 133, 0.14);
    }

    .modal-body {
      padding: 18px 20px 20px;
      display: grid;
      gap: 14px;
    }

    .daily-items {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .daily-row {
      display: grid;
      grid-template-columns: 25px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 50px;
      padding: 5px 0;
      border-bottom: 1px solid var(--line);
    }

    .daily-row:last-child {
      border-bottom: 0;
    }

    .daily-main {
      min-width: 0;
    }

    .daily-task-text {
      display: block;
      overflow: hidden;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 400;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .daily-edit-input {
      width: 100%;
      min-width: 0;
      min-height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 0 9px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 14px;
    }

    .daily-edit-input:focus {
      border-color: var(--accent);
      outline: 3px solid rgba(37, 109, 133, 0.16);
    }

    .daily-row.editing .daily-edit-input {
      grid-column: 2 / -1;
    }

    .daily-count-button {
      min-width: 0;
      min-height: 30px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 6px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      white-space: pre;
      cursor: pointer;
    }

    .daily-count-button:hover,
    .daily-count-button:focus-visible {
      background: rgba(37, 109, 133, 0.1);
      border-color: rgba(37, 109, 133, 0.2);
      outline: 3px solid rgba(37, 109, 133, 0.14);
    }

    .daily-actions {
      display: flex;
      align-items: center;
      gap: 3px;
      flex: 0 0 auto;
    }

    .daily-delete {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .daily-delete:hover,
    .daily-delete:focus-visible {
      background: rgba(37, 109, 133, 0.1);
      color: var(--accent);
      outline: 3px solid rgba(37, 109, 133, 0.14);
    }

    .daily-delete:hover,
    .daily-delete:focus-visible {
      background: rgba(155, 44, 32, 0.1);
      color: #9b2c20;
      outline: 3px solid rgba(155, 44, 32, 0.14);
    }

    .daily-empty {
      color: var(--muted);
      font-size: 15px;
    }

    .checkin-modal {
      width: min(520px, 100%);
      max-height: min(78vh, 760px);
      display: flex;
      flex-direction: column;
    }

    .checkin-body {
      padding: 16px 20px 20px;
      display: grid;
      gap: 12px;
      overflow: hidden;
    }

    .checkin-summary {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .checkin-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
      max-height: min(48vh, 430px);
      overflow: auto;
      padding-right: 2px;
    }

    .checkin-weekday {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 2px 0;
    }

    .checkin-spacer {
      min-height: 42px;
    }

    .checkin-day {
      min-width: 0;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      display: grid;
      place-items: center;
      gap: 1px;
      padding: 3px 2px;
      cursor: pointer;
    }

    .checkin-day:hover,
    .checkin-day:focus-visible {
      border-color: var(--accent);
      outline: 3px solid rgba(37, 109, 133, 0.14);
    }

    .checkin-day.checked {
      border-color: rgba(47, 125, 79, 0.42);
      background: rgba(47, 125, 79, 0.1);
      color: var(--complete);
    }

    .checkin-day.today {
      box-shadow: inset 0 0 0 2px rgba(37, 109, 133, 0.2);
    }

    .checkin-date {
      font-size: 15px;
      line-height: 1.1;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
    }

    .checkin-mark {
      min-height: 13px;
      font-size: 12px;
      line-height: 1;
    }

    .completed-modal {
      width: min(720px, 100%);
      max-height: min(78vh, 820px);
      display: flex;
      flex-direction: column;
    }

    .completed-body {
      padding: 16px 20px 20px;
      display: grid;
      gap: 12px;
      overflow: hidden;
    }

    .completed-summary {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .completed-list {
      display: grid;
      gap: 7px;
      max-height: min(55vh, 520px);
      overflow: auto;
      padding-right: 2px;
    }

    .completed-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbf8f1;
    }

    .completed-text {
      font-size: 16px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .completed-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .restore-button {
      min-width: 76px;
      min-height: 34px;
      border: 1px solid rgba(37, 109, 133, 0.34);
      border-radius: 8px;
      background: #fff;
      color: var(--accent);
      font-weight: 700;
      cursor: pointer;
    }

    .restore-button:hover,
    .restore-button:focus-visible {
      background: rgba(37, 109, 133, 0.1);
      outline: 3px solid rgba(37, 109, 133, 0.14);
    }

    .completed-empty {
      min-height: 120px;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      color: var(--muted);
      display: grid;
      place-items: center;
      padding: 18px;
      text-align: center;
      line-height: 1.45;
    }

    .new-input {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      padding: 0 13px;
      background: white;
      color: var(--text);
    }

    .new-input:focus {
      outline: 3px solid rgba(37, 109, 133, 0.2);
      border-color: var(--accent);
    }

    .form-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
    }

    .date-select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      padding: 0 11px;
      background: white;
      color: var(--text);
    }

    .create-button {
      min-width: 92px;
      min-height: 42px;
      border: 1px solid #1d596d;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .create-button:hover,
    .create-button:focus-visible {
      background: #1d596d;
      outline: 3px solid rgba(37, 109, 133, 0.22);
    }

    @media (max-width: 560px) {
      .app {
        width: min(100vw - 20px, 920px);
        padding-top: 10px;
      }

      .brand {
        display: grid;
        gap: 5px;
      }

      .topbar-actions {
        gap: 6px;
      }

      .date-stamp {
        font-size: 13px;
      }

      .day-header {
        padding: 0 12px;
      }

      .day-title {
        font-size: 16px;
      }

      .todo {
        grid-template-columns: 32px 1fr;
        min-height: 46px;
        padding-right: 72px;
      }

      .todo-text {
        font-size: 16px;
      }

      .todo-input {
        font-size: 16px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .daily-row {
        grid-template-columns: 25px minmax(0, 1fr) auto;
      }

      .completed-item {
        grid-template-columns: 1fr;
        align-items: stretch;
      }

      .restore-button {
        width: 100%;
      }

      .daily-actions {
        grid-column: auto;
        grid-row: auto;
        justify-content: flex-end;
      }

      .daily-count-button {
        justify-content: flex-start;
        min-width: 0;
      }

      .create-button {
        width: 100%;
      }
    }

    /* 2026-07 restrained UI polish: kept as one removable override block. */
    :root {
      --bg: #f3f5f3;
      --surface: #ffffff;
      --line: #dce2de;
      --line-strong: #b7c2bc;
      --text: #202723;
      --muted: #66716b;
      --accent: #256d85;
      --accent-soft: #e2f0f3;
      --complete: #2f7d4f;
      --shadow: 0 24px 64px rgba(35, 48, 41, 0.18);
    }

    body {
      background:
        radial-gradient(circle at 50% -120px, rgba(37, 109, 133, 0.11), transparent 430px),
        linear-gradient(180deg, #f7f9f7 0, var(--bg) 360px);
    }

    .app {
      width: min(940px, calc(100vw - 32px));
      padding: 18px 0 64px;
    }

    .topbar {
      top: 0;
      padding: 12px 2px 14px;
      border: 0;
      border-radius: 0;
      background: linear-gradient(180deg, rgba(247, 249, 247, 0.97), rgba(243, 245, 243, 0.9));
      box-shadow: none;
      backdrop-filter: blur(16px) saturate(1.08);
    }

    h1 {
      font-size: clamp(30px, 4vw, 40px);
      letter-spacing: -0.045em;
    }

    .date-stamp {
      color: #758079;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    .home-button,
    .add-button,
    .completed-button,
    .daily-button {
      width: 42px;
      height: 42px;
      border-color: var(--line);
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(35, 48, 41, 0.07);
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .home-button:hover,
    .add-button:hover,
    .completed-button:hover,
    .daily-button:hover {
      transform: translateY(-1px);
      background: #f8fbfa;
      box-shadow: 0 7px 18px rgba(35, 48, 41, 0.1);
    }

    .status {
      min-height: 34px;
      padding: 8px 4px 10px;
      font-size: 13px;
    }

    .groups {
      gap: 14px;
    }

    .day {
      border-color: rgba(183, 194, 188, 0.72);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 3px 12px rgba(35, 48, 41, 0.055);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .day:hover {
      border-color: var(--line-strong);
      box-shadow: 0 8px 24px rgba(35, 48, 41, 0.075);
    }

    .day.today-group {
      border-color: rgba(37, 109, 133, 0.42);
      box-shadow: 0 8px 26px rgba(37, 109, 133, 0.09);
    }

    .day.today-group > .day-header:not(.selected) {
      background: linear-gradient(90deg, rgba(37, 109, 133, 0.075), rgba(37, 109, 133, 0.018));
    }

    .day-header {
      min-height: 58px;
      padding: 0 18px;
      transition: background 140ms ease, box-shadow 140ms ease;
    }

    .day-header.selected {
      background: var(--accent-soft);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .day-title {
      font-size: 17px;

      overflow: visible;

    .counter-pie-segment {

      transition: opacity 180ms ease, stroke-width 180ms ease, filter 180ms ease;

    /* Approved H workbench layout. */
    :root {
      --wb-bg: #edf0f1;
      --wb-surface: #ffffff;
      --wb-surface-alt: #f6f8f9;
      --wb-ink: #202522;
      --wb-muted: #78807b;
      --wb-line: #dbe0e2;
      --wb-line-strong: #cbd2d5;
      --wb-accent: #536878;
    }

    body {
      background: var(--wb-bg);
      color: var(--wb-ink);
    }

    .app {
      width: min(1800px, calc(100vw - 32px));
      padding: 12px 0 24px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(210px, 1fr) auto;
      gap: 22px;
      min-height: 58px;
      padding: 6px 0 10px;
      background: linear-gradient(180deg, rgba(237, 240, 241, .98), rgba(237, 240, 241, .9));
    }

    .brand {
      align-items: center;
      gap: 10px;
    }

    h1 {
      font-size: 26px;
      letter-spacing: 0;
    }

    .date-stamp {
      font-size: 11px;
    }

    .topbar-actions {
      gap: 7px;
    }

    .counter-shortcuts[hidden] {
      display: none !important;
    }

    .home-button,
    .add-button,
    .completed-button {
      width: 38px;
      height: 38px;
      border-radius: 6px;
      border-color: var(--wb-line);
      box-shadow: none;
    }

    .status {
      min-height: 22px;
      padding: 2px 2px 6px;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      padding-bottom: 12px;
    }

    .workbench-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      height: auto;
      min-height: 0;
      flex: 1;
    }

    .workbench-center,
    .workbench-right {
      display: grid;
      min-width: 0;
      min-height: 0;
      gap: 12px;
    }

    .workbench-center {
      grid-template-rows: minmax(0, 1fr) minmax(156px, .38fr);
    }

    .workbench-right {
      grid-template-rows: minmax(0, 1fr) minmax(156px, .38fr);
    }

    .workbench-center-bottom {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      min-width: 0;
      min-height: 0;
      gap: 12px;
    }

    .workbench-center-bottom.upcoming-hidden {
      grid-template-columns: minmax(0, 1fr);
    }

    .upcoming-panel[hidden] {
      display: none !important;
    }

    .workbench-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--wb-line-strong);
      border-radius: 7px;
      background: var(--wb-surface);
      box-shadow: 0 8px 24px rgba(34, 42, 38, .055);

    .workbench-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 54px;
      border-bottom: 1px solid var(--wb-line);
      padding: 0 14px;
      background: var(--wb-surface-alt);
    }

    .workbench-panel-head > div {
      display: flex;
      align-items: baseline;
      gap: 9px;
      min-width: 0;
    }

    .workbench-panel-head h2 {
      margin: 0;
      color: var(--wb-ink);
      font-size: 18px;
      font-weight: 760;
      letter-spacing: 0;
      white-space: nowrap;

    .workbench-panel-head span {

      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;

    .panel-icon-button {

    .workbench-scroll {

    .prefix-groups {

    .prefix-group {

    .workbench-list .todo:hover,

    .upcoming-task-list .todo:hover {

    }

    .workbench-focus-todo {

    }

    .workbench-list .checkbox,

    .upcoming-task-list .checkbox {
      width: 19px;
      height: 19px;
      border-radius: 4px;
    }

    .workbench-list .todo-text,
    .prefix-tasks .todo-text,
    .upcoming-task-list .todo-text {
      display: grid;
      align-self: center;
      gap: 2px;
      min-width: 0;
      font-size: 15px;
      line-height: 1.45;
    }

    .workbench-list .todo.selected,
    .prefix-tasks .todo.selected,
    .upcoming-task-list .todo.selected {
      border-color: transparent;
      background: #eef3f1;
      box-shadow: none;
    }

    .workbench-task-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workbench-task-meta {
      overflow: hidden;
      color: var(--wb-muted);
      font-size: 11px;
      font-weight: 400;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workbench-list .todo-action,
    .prefix-tasks .todo-action,
    .upcoming-task-list .todo-action {
      border-radius: 5px;
      box-shadow: none;
    }

    .upcoming-groups {
      display: grid;
      align-content: start;
      padding: 0 14px 12px;
    }

    .upcoming-day {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      border-bottom: 1px solid var(--wb-line);
    }

    .upcoming-day:last-child {
      border-bottom: 0;
    }

    .upcoming-day-label {
      padding: 11px 9px 8px 0;
      border-right: 1px solid #e6e9e7;
    }

    .upcoming-day-label strong,
    .upcoming-day-label span {
      display: block;
    }

    .upcoming-day-label strong {
      font-size: 14px;
    }

    .upcoming-day-label span {
      margin-top: 3px;
      color: var(--wb-muted);
      font-size: 11px;
    }

    .upcoming-task-list {
      display: grid;
      min-width: 0;
      padding: 3px 0 3px 11px;
    }

    .workbench-empty {
      display: grid;
      min-height: 94px;
      place-items: center;
      padding: 16px;
      color: var(--wb-muted);
      font-size: 13px;
      text-align: center;
    }

    .daily-home-list {
      display: grid;
      align-content: start;
      padding: 3px 13px 10px;
    }


    .daily-home-list .daily-items {
      gap: 0;

      min-width: 92px;
      justify-content: center;
      padding: 0 5px;

      width: 19px;

      border: 1.5px solid #96a19b;
      border-radius: 4px;
      background: #fff;
      color: #fff;

    .daily-home-check.checked {
      border-color: #536878;
      background: #536878;
    }

    .daily-home-check.checked::after {
      content: "✓";
      font-size: 12px;
      font-weight: 800;
    }

    .counters-home-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      min-height: 0;
    }

    .counter-home-period-toggle {
      border: 0;
      background: transparent;
      color: var(--wb-muted);
      padding: 2px 3px;
      font-size: 12px;
      font-weight: 650;
      line-height: 1.2;
      cursor: pointer;

    .counter-home-period-toggle:hover,
    .counter-home-period-toggle:focus-visible {
      border-radius: 3px;
      background: rgba(83, 104, 120, 0.07);
      color: var(--wb-ink);
      outline: 2px solid rgba(83, 104, 120, 0.16);
      outline-offset: 1px;
    }

    .counter-home-item {
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 5px;
      min-width: 0;
      border-right: 1px solid #e0e4e1;
      padding: 8px 4px;
    }

    .counter-home-item:last-child {
      border-right: 0;
    }

    .counter-home-label {
      overflow: hidden;
      max-width: 100%;
      color: var(--wb-muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .counter-home-activity {
      position: relative;
      display: grid;
      width: 38px;
      height: 34px;
      place-items: center;
      overflow: visible;
      border-radius: 5px;
    }

    .counter-home-activity img {
      display: block;
      width: 30px;
      height: 30px;
      opacity: 0.7;
    }

    .counter-home-activity::after {
      content: attr(data-tooltip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 5px);
      z-index: 3;
      padding: 4px 7px;
      border-radius: 4px;
      background: #29302c;
      color: #fff;
      font-size: 11px;
      line-height: 1.2;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 3px);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .counter-home-activity:hover::after,
    .counter-home-activity:focus-visible::after {
      opacity: 1;
      transform: translate(-50%, 0);

    .counter-home-activity:focus-visible {

    .counter-home-item strong {

      font-variant-numeric: tabular-nums;

    .counter-home-item button {

      height: 34px;

      border-radius: 50%;
      background: transparent;
      color: #39433d;
      font-size: 12px;
      font-weight: 750;
    }

    .counter-home-item button:hover,
    .counter-home-item button:focus-visible {
      border-color: var(--wb-accent);
      background: #eef2f4;
      outline: 3px solid rgba(83, 104, 120, .13);
    }

    body.read-only .daily-home-check,
    body.read-only .counter-home-item button {
      opacity: .5;
    }

    @media (max-width: 1120px) {
      html,
      body {
        height: auto;
        min-height: 100%;
        overflow: auto;
      }

      .app {

      .topbar {

    @media (max-width: 720px) {

      .workbench-center,

      .workbench-center-bottom {

        flex-direction: column;

      .today-panel,

        min-height: 180px;
      }

      .prefix-group,
      .upcoming-day {
        grid-template-columns: 68px minmax(0, 1fr);
      }
    }
  </style>

      counterHomePeriodToggle: document.getElementById("counterHomePeriodToggle"),
      openCounterHome: document.getElementById("openCounterHome"),
      openCompleted: document.getElementById("openCompleted"),
      openNew: document.getElementById("openNew"),
      closeNew: document.getElementById("closeNew"),

      checkinTitle: document.getElementById("checkinTitle"),

      checkinGrid: document.getElementById("checkinGrid"),
      closeCompleted: document.getElementById("closeCompleted"),
      completedSummary: document.getElementById("completedSummary"),
      completedList: document.getElementById("completedList"),
      counterShortcuts: document.getElementById("counterShortcuts"),
      counterBackdrop: document.getElementById("counterBackdrop"),
      closeCounter: document.getElementById("closeCounter"),
      counterFilters: document.getElementById("counterFilters"),

      counterCharts: document.getElementById("counterCharts"),
      counterRecords: document.getElementById("counterRecords"),
      openCounterItem: document.getElementById("openCounterItem"),
      openCounterRecord: document.getElementById("openCounterRecord"),
      counterItemBackdrop: document.getElementById("counterItemBackdrop"),
      closeCounterItem: document.getElementById("closeCounterItem"),
      cancelCounterItem: document.getElementById("cancelCounterItem"),
      counterItemForm: document.getElementById("counterItemForm"),
      counterItemTitle: document.getElementById("counterItemTitle"),
      counterItemId: document.getElementById("counterItemId"),
      counterItemName: document.getElementById("counterItemName"),
      counterItemPinned: document.getElementById("counterItemPinned"),
      counterItemColor: document.getElementById("counterItemColor"),

      dailyItems: null,
    };

    els.todayLabel.textContent = formatFullDate(state.today);
    els.openCompleted.addEventListener("click", openCompleted);
    els.openNew.addEventListener("click", openModal);
